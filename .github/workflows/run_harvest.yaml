name: Run Harvest and Waxer 🐝

permissions:
  contents: write

on:
  schedule:
    - cron: '2 7 * * *'  # Runs daily at 2:02 AM Central (8:02 UTC during DST)
  workflow_dispatch:

jobs:
  harvest_and_wax:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📁 Create log folder
        run: mkdir -p log

      - name: 🕒 Log workflow start time
        run: echo "=== Workflow run at $(date -u) UTC ===" >> log/log.txt

      - name: 🐝 Run harvest.py
        run: |
          echo "--- Running harvest.py ---" | tee -a log/log.txt
          if python code/harvest.py 2>&1 | tee -a log/log.txt; then
            echo "✅ harvest.py completed successfully" | tee -a log/log.txt
          else
            echo "❌ harvest.py failed" | tee -a log/log.txt
            exit 1
          fi

      - name: 🕯️ Run waxer.py
        run: |
          echo "--- Running waxer.py ---" | tee -a log/log.txt
          if python code/waxer.py 2>&1 | tee -a log/log.txt; then
            echo "✅ waxer.py completed successfully" | tee -a log/log.txt
          else
            echo "❌ waxer.py failed" | tee -a log/log.txt
            exit 1
          fi

      - name: 🚀 Commit and push updated XML + log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xml/words.xml xml/puzzles.xml log/log.txt
          git diff --quiet --cached || git commit -m "chore: Bee update + log for $(date +'%Y-%m-%d')"
          git push || echo "Nothing to push or push failed."
