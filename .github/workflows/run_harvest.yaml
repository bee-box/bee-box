name: Run Harvest and Waxer 🐝

permissions:
  contents: write

on:
  schedule:
    # Two cron schedules ensure 2:02 AM Central Time year-round
    # GitHub Actions only supports UTC, so we need both to handle DST transitions
    - cron: '2 8 * * *'  # Runs daily at 2:02 AM CST (Nov-Mar, UTC-6)
    - cron: '2 7 * * *'  # Runs daily at 2:02 AM CDT (Mar-Nov, UTC-5)
    # During DST transition days, this will run twice (2:02 AM and 3:02 AM)
    # but the script handles duplicate runs gracefully with "no changes to commit"
  workflow_dispatch:

jobs:
  harvest_and_wax:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📁 Create log folder
        run: mkdir -p log

      - name: 🕒 Log workflow start
        run: |
          RUN_ID=$(date -u +"%Y%m%d%H%M%S")
          RUN_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          
          # Create log file with headers if it doesn't exist
          if [ ! -f log/log.txt ]; then
            echo "TIMESTAMP,STATUS,MESSAGE" > log/log.txt
          fi
          
          # Log start event
          echo "$RUN_TIME,START,\"Workflow started\"" >> log/log.txt

      - name: 🐝 Run harvest.py
        id: harvest
        run: python code/harvest.py
        continue-on-error: false

      - name: 🕯️ Run waxer.py
        id: waxer
        run: python code/waxer.py
        continue-on-error: false

      - name: 🚀 Commit and push updated files
        run: |
          RUN_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xml/words.xml xml/puzzles.xml log/log.txt
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "$RUN_TIME,SUCCESS,\"No changes to commit\"" >> log/log.txt
          else
            git commit -m "chore: Bee update + log for $(date +'%Y-%m-%d')"
            
            if git push; then
              echo "$RUN_TIME,SUCCESS,\"Changes pushed successfully\"" >> log/log.txt
            else
              echo "$RUN_TIME,FAILURE,\"Failed to push changes\"" >> log/log.txt
              exit 1
            fi
          fi
          
          # Log workflow completion
          echo "$RUN_TIME,SUCCESS,\"Workflow completed\"" >> log/log.txt
          echo "────────────────────────────────────────────────────────────" >> log/log.txt

      - name: 📝 Log workflow failure
        if: failure()
        run: |
          RUN_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "$RUN_TIME,FAILURE,\"Workflow failed\"" >> log/log.txt
          echo "────────────────────────────────────────────────────────────" >> log/log.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log/log.txt
          git commit -m "chore: Log workflow failure for $(date +'%Y-%m-%d')"
          git push || true