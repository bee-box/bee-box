name: Run Harvest and Waxer 🐝

permissions:
  contents: write

on:
  schedule:
    - cron: '2 7 * * *'  # 2:02 AM Central = 7:02 AM UTC
  workflow_dispatch:

jobs:
  harvest_and_wax:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 📦 Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: 📁 Create logs folder
        run: mkdir -p logs

      - name: 🐝 Run harvest.py and log output
        run: |
          LOGFILE="logs/harvest-$(date +'%Y-%m-%d').log"
          python harvest.py > "$LOGFILE" 2>&1

      - name: 🕯️ Run waxer.py and log output
        if: success()
        run: |
          LOGFILE="logs/waxer-$(date +'%Y-%m-%d').log"
          python waxer.py > "$LOGFILE" 2>&1

      - name: 🚀 Commit and push updated XML + logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xml/words.xml xml/puzzles.xml logs/
          git diff --quiet --cached || git commit -m "chore: Bee update + logs for $(date +'%Y-%m-%d')"
          git push || echo "Nothing to push or push failed."