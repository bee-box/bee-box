<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spelling Bee Grid</title>
    <link rel="stylesheet" href="style/grids.css">
    <link rel="icon" href="style/bee.ico" type="image/x-icon">
  </head>  
<body>

<nav class="banner" id="banner">
  <div class="left-section">
    <div class="banner-title">Spelling Bee Grid</div>
    <div id="puzzleDate" class="banner-date"></div>
  </div>

  <div class="right-section">
    <select id="dateSelector"></select>
    <button onclick="window.print()" title="Print a clean black and white version">Print</button>
    <button onclick="goHome()">Home</button>
  </div>
</nav>

<div class="letter-grid" id="letterGrid"></div>
<div class="puzzle-summary" id="puzzleSummary"></div>

<table id="gridTable">
  <thead>
    <tr>
      <th class="bee-header">
      </th>
      <!-- other headers dynamically generated -->
    </tr>
  </thead>
  <tbody>
    <!-- table content injected dynamically -->
  </tbody>
</table>

<div class="two-letter-list" id="twoLetterList"></div>

<script>
async function loadPuzzles() {
  const response = await fetch('xml/puzzles.xml');
  const xmlText = await response.text();
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
  return Array.from(xmlDoc.getElementsByTagName('puzzle'));
}

function findPuzzleByDate(puzzles, date) {
  return puzzles.find(p => p.getAttribute('date') === date);
}

function getURLDate() {
  const params = new URLSearchParams(window.location.search);
  return params.get('date');
}

function buildDropdown(puzzles) {
  const selector = document.getElementById('dateSelector');
  puzzles.sort((a, b) => new Date(b.getAttribute('date')) - new Date(a.getAttribute('date')));
  puzzles.forEach(puzzle => {
    const date = puzzle.getAttribute('date');
    const option = document.createElement('option');
    option.value = date;
    option.textContent = date;
    selector.appendChild(option);
  });
}

function renderGrid(puzzle) {
  const words = Array.from(puzzle.getElementsByTagName('word'));
  const counts = {};
  const twoLetterCounts = {};
  const allLengthsSet = new Set();

  words.forEach(word => {
    const length = word.getAttribute('length');
    const first = word.getAttribute('first').toLowerCase();
    const firsttwo = word.getAttribute('firsttwo').toLowerCase();
    counts[first] = counts[first] || {};
    counts[first][length] = (counts[first][length] || 0) + 1;
    twoLetterCounts[firsttwo] = (twoLetterCounts[firsttwo] || 0) + 1;
    allLengthsSet.add(length);
  });

  const lengths = Array.from(allLengthsSet).sort((a, b) => a - b);
  const letters = Object.keys(counts).sort();

  let html = '<tr><th class="bee-header"></th>' + lengths.map(l => `<th>${l}</th>`).join('') + '<th>Σ</th></tr>';

  letters.forEach(letter => {
    let sum = 0;
    html += `<tr><td><b>${letter}</b>:</td>`;
    lengths.forEach(length => {
      const count = counts[letter][length] || '-';
      sum += count === '-' ? 0 : count;
      html += `<td>${count}</td>`;
    });
    html += `<td>${sum}</td></tr>`;
  });

  let totalRow = '<tr><td>Σ:</td>';
  let totalWords = 0;
  lengths.forEach(length => {
    let colTotal = 0;
    letters.forEach(letter => {
      colTotal += counts[letter][length] || 0;
    });
    totalWords += colTotal;
    totalRow += `<td>${colTotal}</td>`;
  });
  totalRow += `<td>${totalWords}</td></tr>`;

  document.getElementById('gridTable').innerHTML = html + totalRow;

  const points = puzzle.getAttribute('queenbee') || 0;
  const pangrams = puzzle.getAttribute('pangrams') || 0;
  const perfect = puzzle.getAttribute('perfectpangrams') || 0;

  let summaryText = `WORDS: ${totalWords}, POINTS: ${points}, PANGRAMS: ${pangrams}`;
if (parseInt(perfect) > 0) {
  summaryText += ` (${perfect} Perfect)`;
}
const bingo = puzzle.getAttribute("bingo");
if (bingo === "BINGO") {
  summaryText += `, BINGO`;
}

  document.getElementById('puzzleSummary').innerHTML = summaryText;

  const fullLetters = (puzzle.getAttribute('letters') || '').toLowerCase().split('');
  const formattedLetters = fullLetters.map((letter, index) => index === 0 ? `<b>${letter.toUpperCase()}</b>` : letter.toUpperCase()).join(' ');
  document.getElementById('letterGrid').innerHTML = formattedLetters;

  const twoLetterKeys = Object.keys(twoLetterCounts).sort();
  let grouped = {};
  twoLetterKeys.forEach(item => {
    const firstChar = item[0].toUpperCase();
    if (!grouped[firstChar]) grouped[firstChar] = [];
    grouped[firstChar].push(item.toUpperCase() + '-' + twoLetterCounts[item]);
  });

  let twoLetterHtml = '<strong>Two letter list:</strong><br>';
  for (const letter in grouped) {
    twoLetterHtml += grouped[letter].join(' ') + '<br>';
  }
  document.getElementById('twoLetterList').innerHTML = twoLetterHtml;

  const rawDate = puzzle.getAttribute('date');
  const [year, month, day] = rawDate.split('-').map(Number);
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dateObj = new Date(year, month - 1, day);
  const weekday = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
  const formattedDate = `${weekday}, ${monthNames[month - 1]} ${day}, ${year}`;
  document.getElementById('puzzleDate').textContent = formattedDate;

  document.body.classList.add('loaded');
}

function goHome() {
  window.location.href = 'https://beebox.ghost.io';
}

(async function() {
  const puzzles = await loadPuzzles();
  buildDropdown(puzzles);

  const urlDate = getURLDate();
  let selectedPuzzle = urlDate ? findPuzzleByDate(puzzles, urlDate) : puzzles[0];

  if (!selectedPuzzle) {
    selectedPuzzle = puzzles[0];
  }

  document.getElementById('dateSelector').value = selectedPuzzle.getAttribute('date');
  renderGrid(selectedPuzzle);

  document.getElementById('dateSelector').addEventListener('change', (e) => {
    const selected = findPuzzleByDate(puzzles, e.target.value);
    if (selected) {
      renderGrid(selected);
      history.replaceState(null, '', `?date=${e.target.value}`);
    }
  });
})();
</script>

</body>
</html>
