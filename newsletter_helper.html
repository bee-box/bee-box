<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puzzles Newsletter Helper</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #444;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    .date {
      font-weight: bold;
      margin-right: 1rem;
      width: 6rem;
    }
    .thumb {
      width: 40px;
      height: 40px;
      margin-right: 1rem;
      object-fit: cover;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .links a {
      margin-right: 1rem;
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Newsletter Helper</h1>
  <ul id="missing-list">
    <!-- Entries will be injected here -->
  </ul>

  <script>
    fetch("xml/puzzles.xml")
      .then(response => response.text())
      .then(xmlText => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "application/xml");
        const puzzles = xml.querySelectorAll("puzzle");

        puzzles.forEach(puzzle => {
          const words = puzzle.querySelectorAll("word");
          if (words.length === 0) {
            const id = puzzle.getAttribute("id");
            const date = puzzle.getAttribute("date");
            if (id && date) {
              const [yyyy, mm, dd] = date.split("-");
              const sheetURL = `https://bee-box.github.io/bee-box/sheet.html?puzzleid=${id}`;
              const jumbleURL = `https://bee-box.github.io/bee-box/jumble.html?puzzleid=${id}`;
              const peekURL = `https://bee-box.github.io/bee-box/peek.html?puzzleid=${id}`;
              const imgSrc = `https://bee-box.github.io/bee-box/images/${mm}-${dd}.png`;

              const li = document.createElement("li");

              const dateSpan = document.createElement("span");
              dateSpan.className = "date";
              dateSpan.textContent = date;

              const thumbLink = document.createElement("a");
              thumbLink.href = imgSrc;
              thumbLink.target = "_blank";
              thumbLink.rel = "noopener";

              const img = document.createElement("img");
              img.className = "thumb";
              img.src = imgSrc;
              img.alt = `${mm}-${dd}`;
              thumbLink.appendChild(img);

              const linkContainer = document.createElement("div");
              linkContainer.className = "links";

              const sheetLink = document.createElement("a");
              sheetLink.href = sheetURL;
              sheetLink.textContent = "BEESHEET";

              const jumbleLink = document.createElement("a");
              jumbleLink.href = jumbleURL;
              jumbleLink.textContent = "BEEJUMBLE";

              const peekLink = document.createElement("a");
              peekLink.href = peekURL;
              peekLink.textContent = "BEEPEEK";

              linkContainer.appendChild(sheetLink);
              linkContainer.appendChild(jumbleLink);
              linkContainer.appendChild(peekLink);

              li.appendChild(dateSpan);
              li.appendChild(thumbLink);
              li.appendChild(linkContainer);
              document.getElementById("missing-list").appendChild(li);
            }
          }
        });
      })
      .catch(error => {
        console.error("Failed to load or parse puzzles.xml:", error);
      });
  </script>
</body>
</html>
