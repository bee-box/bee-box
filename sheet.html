<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title id="pageTitle">Bee Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style/main.css">
  <link rel="icon" href="style/bee.ico" type="image/x-icon" />
</head>
<body>
<nav id="navtitle" class="section-box">
  <div class="nav-container">
    <div class="nav-left">
      <h1 id="toolNameHeading">Bee Sheet</h1>
      <div id="navtitleContent" class="date-display"></div>
    </div>
    <div class="nav-right" id="navControls">
      <select id="dateSelector"><option value="">Choose a Day</option></select>
      <button id="printButton">Print</button>
      <button id="revealButton">Reveal</button>
      <a href="https://beebox.ghost.io" target="_blank">Home</a>
      <a href="#" id="subscribePopupBtn" onclick="openSubscribeModal(); return false;">Subscribe</a>
    </div>
  </div>
</nav>

<section id="header" class="section-box"><div id="headerContent" class="loading">Loading...</div></section>

<!-- Combined section that replaces letterLengths and tool sections -->
<section id="combinedSection" class="section-box"><div id="combinedContent" class="loading">Loading...</div></section>

<footer class="section-box">
  <p>Made by Kevin Kolb · <a href="https://beebox.ghost.io" target="_blank">beebox.ghost.io</a></p>
</footer>

<div class="modal-overlay" id="subscribeOverlay">
  <div class="modal-content">
    <button class="modal-close" onclick="closeSubscribeModal()">&times;</button>
    <iframe src="https://beebox.ghost.io/subscribe/" title="Subscribe Form"></iframe>
  </div>
</div>

<script>
const toolName = "Bee Sheet";
let globalWords = [];
let revealMode = false;

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("pageTitle").textContent = toolName;
  document.getElementById("toolNameHeading").textContent = toolName;
  setupEventListeners();
  loadPuzzleData();
});

function openSubscribeModal() {
  document.getElementById("subscribeOverlay").style.display = "flex";
}
function closeSubscribeModal() {
  document.getElementById("subscribeOverlay").style.display = "none";
}

function setupEventListeners() {
  document.getElementById("dateSelector").addEventListener("change", (e) => {
    const d = e.target.value;
    if (d) {
      const u = new URL(window.location);
      u.searchParams.set("date", d);
      u.searchParams.delete("puzzleid");
      window.location.href = u.toString();
    }
  });

  document.getElementById("printButton").addEventListener("click", () => {
    const wordBoxes = document.querySelectorAll(".word-box");
    wordBoxes.forEach((b) => b.setAttribute("data-print-value", b.textContent));

    window.addEventListener("beforeprint", () => {
      wordBoxes.forEach(b => b.textContent = b.getAttribute("data-print-value"));
    }, { once: true });

    window.addEventListener("afterprint", () => {
      wordBoxes.forEach(b => {
        b.textContent = revealMode ? b.dataset.word : b.dataset.firsttwo;
      });
    }, { once: true });

    window.print();
  });

  document.getElementById("revealButton").addEventListener("click", () => {
    revealMode = !revealMode;
    toggleRevealAll(revealMode);
  });
}

async function loadPuzzleData() {
  const els = ["combinedContent", "headerContent"].map(id => document.getElementById(id));
  els.forEach(el => { el.className = "loading"; el.textContent = "Loading..."; });

  try {
    const xml = new DOMParser().parseFromString(await (await fetch("xml/puzzles.xml")).text(), "application/xml");
    const puzzles = [...xml.querySelectorAll("puzzle")]
      .filter(p => p.getElementsByTagName("word").length)
      .sort((a, b) => new Date(a.getAttribute("date")) - new Date(b.getAttribute("date")));

    const params = new URLSearchParams(window.location.search);
    const puzzleId = params.get("puzzleid");
    const date = params.get("date");
    const mostRecent = puzzles.at(-1);

    let selected;
    if (puzzleId && !date) {
      selected = puzzles.find((x) => x.id === puzzleId);
    } else if (date && !puzzleId) {
      selected = puzzles.find((x) => x.getAttribute("date") === date);
      if (selected === mostRecent) {
        openSubscribeModal();
        selected = puzzles.at(-2);
      }
    } else {
      selected = puzzles.at(-2);
    }

    populateDateSelector(puzzles, selected?.getAttribute("date"));
    displayPuzzle(selected);
  } catch {
    // For demonstration purposes, create some sample puzzle data if loading fails
    const samplePuzzleData = createSamplePuzzleData();
    displayPuzzle(samplePuzzleData);
    populateDateSelector([samplePuzzleData], samplePuzzleData.getAttribute("date"));
  }
}

function createSamplePuzzleData() {
  // Create a sample puzzle node for demonstration
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString("<puzzles></puzzles>", "application/xml");
  const puzzle = xmlDoc.createElement("puzzle");
  
  // Set puzzle attributes
  puzzle.setAttribute("date", "2025-05-12");
  puzzle.setAttribute("letters", "ABCDEFG");
  puzzle.setAttribute("letter1", "A");
  puzzle.setAttribute("letter1count", "8");
  puzzle.setAttribute("letter2", "B");
  puzzle.setAttribute("letter2count", "6");
  puzzle.setAttribute("letter3", "C");
  puzzle.setAttribute("letter3count", "5");
  puzzle.setAttribute("letter4", "D");
  puzzle.setAttribute("letter4count", "4");
  puzzle.setAttribute("letter5", "E");
  puzzle.setAttribute("letter5count", "7");
  puzzle.setAttribute("letter6", "F");
  puzzle.setAttribute("letter6count", "3");
  puzzle.setAttribute("letter7", "G");
  puzzle.setAttribute("letter7count", "4");
  puzzle.setAttribute("pangrams", "2");
  puzzle.setAttribute("perfectpangrams", "1");
  puzzle.setAttribute("bingo", "BINGO");
  puzzle.setAttribute("queenbee", "24");
  
  // Create sample words
  const words = [
    {text: "AGENDA", first: "A", firsttwo: "AG", length: 6},
    {text: "ABLE", first: "A", firsttwo: "AB", length: 4},
    {text: "ACNE", first: "A", firsttwo: "AC", length: 4},
    {text: "BADGE", first: "B", firsttwo: "BA", length: 5},
    {text: "BEAD", first: "B", firsttwo: "BE", length: 4},
    {text: "CABBAGE", first: "C", firsttwo: "CA", length: 7},
    {text: "CAFE", first: "C", firsttwo: "CA", length: 4},
    {text: "DECAF", first: "D", firsttwo: "DE", length: 5},
    {text: "DEAF", first: "D", firsttwo: "DE", length: 4},
    {text: "EDGE", first: "E", firsttwo: "ED", length: 4},
    {text: "FACE", first: "F", firsttwo: "FA", length: 4},
    {text: "FACADE", first: "F", firsttwo: "FA", length: 6},
    {text: "GAGE", first: "G", firsttwo: "GA", length: 4},
    {text: "GABFED", first: "G", firsttwo: "GA", length: 6}
  ];
  
  words.forEach(w => {
    const wordElem = xmlDoc.createElement("word");
    wordElem.textContent = w.text;
    wordElem.setAttribute("first", w.first);
    wordElem.setAttribute("firsttwo", w.firsttwo);
    wordElem.setAttribute("length", w.length);
    puzzle.appendChild(wordElem);
  });
  
  return puzzle;
}

function populateDateSelector(puzzles, selectedDate) {
  const s = document.getElementById("dateSelector");
  while (s.options.length > 1) s.remove(1);
  [...puzzles].reverse().forEach(p => {
    const d = p.getAttribute("date");
    s.add(new Option(d, d, d === selectedDate, d === selectedDate));
  });
}

function formatDateString(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
}

function displayPuzzle(p) {
  const combinedContent = document.getElementById("combinedContent");
  const headerContent = document.getElementById("headerContent");
  combinedContent.innerHTML = headerContent.innerHTML = "";

  const raw = p.getAttribute("date");
  document.getElementById("navtitleContent").textContent = formatDateString(raw);

  const countsArr = [...Array(7)].map((_, i) => ({
    letter: (p.getAttribute(`letter${i + 1}`) || "").toUpperCase(),
    count: +p.getAttribute(`letter${i + 1}count`) || 0
  }));
  const countsMap = Object.fromEntries(countsArr.map(o => [o.letter, o.count]));

  const lettersAll = (p.getAttribute("letters") || "").toUpperCase().split("").sort();
  const boldLetter = (p.getAttribute("letter1") || lettersAll[0]).toUpperCase();

  globalWords = [...p.getElementsByTagName("word")].map(w => ({
    text: w.textContent,
    length: +w.getAttribute("length") || w.textContent.length,
    first: (w.getAttribute("first") || w.textContent[0]).toUpperCase(),
    firsttwo: w.getAttribute("firsttwo") || w.textContent.slice(0, 2),
    revealed: false // Add a revealed state to track each word
  }));
  const byLetter = {};
  globalWords.forEach(w => (byLetter[w.first] = byLetter[w.first] || []).push(w));

  const pang = p.getAttribute("pangrams") || 0;
  const perf = p.getAttribute("perfectpangrams") || 0;
  const bingo = p.getAttribute("bingo") === "BINGO" ? "BINGO" : "NO BINGO";
  const q = +p.getAttribute("queenbee") || 0;
  const thresh = q ? [
    `Good Start: ${Math.round(q * 0.02)}`, `Moving Up: ${Math.round(q * 0.05)}`,
    `Good: ${Math.round(q * 0.08)}`, `Solid: ${Math.round(q * 0.15)}`,
    `Nice: ${Math.round(q * 0.25)}`, `Great: ${Math.round(q * 0.40)}`,
    `Amazing: ${Math.round(q * 0.50)}`, `Genius: ${Math.round(q * 0.70)}`,
    `Queen Bee: ${q}`
  ] : [];

  headerContent.innerHTML = [
    `The Completely Unauthorized NY Times Spelling Bee Toolbox presents the Bee Sheet for ${formatDateString(raw)}`,
    `Words: ${globalWords.length}, Pangrams: ${pang} (${perf} Perfect), ${bingo}`,
    thresh.join(", ")
  ].map(t => `<p>${t}</p>`).join("");

  // Define both regular and inverted number icons
  const numIcons = {
    1: "①", 2: "②", 3: "③", 4: "④", 5: "⑤", 6: "⑥", 7: "⑦", 8: "⑧", 9: "⑨", 10: "⑩",
    11: "⑪", 12: "⑫", 13: "⑬", 14: "⑭", 15: "⑮", 16: "⑯", 17: "⑰", 18: "⑱", 19: "⑲", 20: "⑳"
  };
  
  // Define inverted/highlighted versions of the number icons
  const invertedNumIcons = {
    1: "❶", 2: "❷", 3: "❸", 4: "❹", 5: "❺", 6: "❻", 7: "❼", 8: "❽", 9: "❾", 10: "❿",
    11: "⓫", 12: "⓬", 13: "⓭", 14: "⓮", 15: "⓯", 16: "⓰", 17: "⓱", 18: "⓲", 19: "⓳", 20: "⓴"
  };

  // Create the combined content structure
  const combinedContainer = document.createElement("div");
  combinedContainer.className = "combined-container";

  // 1. Create letters section
  const lettersSection = document.createElement("div");
  lettersSection.className = "letters-section";
  lettersSection.innerHTML = `
    <table class="bee-table letters-table">
      <tr>
        ${lettersAll.map(l => `
          <td>
            <div class="wrapper">
              <span class="char ${l === boldLetter ? "bold" : ""}">${l}</span>
              <span class="count">${countsMap[l] ?? 0}</span>
            </div>
          </td>`).join("")}
      </tr>
    </table>
  `;
  
  // 2. Create the word columns with integrated length indicators
  const wordColumnsContainer = document.createElement("div");
  wordColumnsContainer.className = "word-columns-container";
  
  lettersAll.forEach(l => {
    const columnDiv = document.createElement("div");
    columnDiv.className = "letter-column";
    
    // Column header with letter
    const columnHeader = document.createElement("div");
    columnHeader.className = "column-header";
    columnHeader.innerHTML = `
      <div class="letter-header ${l === boldLetter ? "bold" : ""}">
        ${l}
        <span class="count-badge">${countsMap[l] ?? 0}</span>
      </div>
    `;
    
    // Length indicators row
    const lengthIndicatorsDiv = document.createElement("div");
    lengthIndicatorsDiv.className = "length-indicators";
    
    const wordsInColumn = byLetter[l] || [];
    if (wordsInColumn.length > 0) {
      wordsInColumn
        .sort((a, b) => a.length - b.length || a.text.localeCompare(b.text))
        .forEach((w, idx) => {
          const length = w.length;
          const wordId = `${l}-${length}-${idx}`;
          w.lengthIconId = wordId; // Store the ID reference in the word object
          
          const lengthIcon = document.createElement("span");
          lengthIcon.id = `length-${wordId}`;
          lengthIcon.className = "length-icon";
          lengthIcon.textContent = numIcons[length] || length;
          lengthIndicatorsDiv.appendChild(lengthIcon);
        });
    } else {
      lengthIndicatorsDiv.innerHTML = "<span class='no-words'>–</span>";
    }
    
    // Word boxes
    const wordBoxesDiv = document.createElement("div");
    wordBoxesDiv.className = "word-boxes";
    
    if (wordsInColumn.length > 0) {
      wordsInColumn.sort((a, b) => a.text.localeCompare(b.text)).forEach((w, idx) => {
        const box = document.createElement("div");
        box.className = "word-box";
        box.dataset.word = w.text;
        box.dataset.firsttwo = w.firsttwo;
        box.dataset.lengthIconId = w.lengthIconId;
        box.textContent = revealMode ? w.text : w.firsttwo;
        
        // Add click handler to toggle word display and update length indicator
        box.addEventListener("click", () => {
          const isRevealing = box.textContent === box.dataset.firsttwo;
          box.textContent = isRevealing ? box.dataset.word : box.dataset.firsttwo;
          
          // Add a pulse animation class and remove it after animation completes
          box.classList.add('just-toggled');
          setTimeout(() => box.classList.remove('just-toggled'), 300);
          
          // Find and update the corresponding length icon
          const lengthIcon = document.getElementById(`length-${box.dataset.lengthIconId}`);
          if (lengthIcon) {
            const length = w.length;
            lengthIcon.textContent = isRevealing ? invertedNumIcons[length] || `[${length}]` : numIcons[length] || length;
            
            // Optional: Add a visual class for additional styling
            if (isRevealing) {
              lengthIcon.classList.add('revealed');
            } else {
              lengthIcon.classList.remove('revealed');
            }
          }
          
          // Update the revealed state in our data model
          w.revealed = isRevealing;
        });
        
        wordBoxesDiv.appendChild(box);
      });
    }
    
    // Assemble the column
    columnDiv.appendChild(columnHeader);
    columnDiv.appendChild(lengthIndicatorsDiv);
    columnDiv.appendChild(wordBoxesDiv);
    wordColumnsContainer.appendChild(columnDiv);
  });
  
  // Add a suggested style for the combined layout
  const styleElement = document.createElement("style");
  styleElement.textContent = `
    .combined-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .letters-section {
      margin-bottom: 10px;
    }
    
    .word-columns-container {
      display: grid;
      grid-template-columns: repeat(${lettersAll.length}, 1fr);
      gap: 10px;
    }
    
    .letter-column {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .column-header {
      text-align: center;
      font-weight: bold;
      padding: 5px 0;
    }
    
    .letter-header {
      font-size: 1.2em;
      position: relative;
    }
    
    .letter-header.bold {
      color: #e86b1c;
    }
    
    .count-badge {
      font-size: 0.7em;
      vertical-align: super;
    }
    
    .length-indicators {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      min-height: 25px;
      padding: 5px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    
    .length-icon {
      font-size: 0.9em;
      cursor: default;
    }
    
    .length-icon.revealed {
      color: #e86b1c;
    }
    
    .word-boxes {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .word-box {
      padding: 5px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    
    .word-box:hover {
      background: #f0f0f0;
    }
    
    .word-box.just-toggled {
      animation: pulse 0.3s;
    }
    
    @keyframes pulse {
      0% { background-color: #fff; }
      50% { background-color: #ffe0b2; }
      100% { background-color: #fff; }
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .word-columns-container {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    
    @media (max-width: 480px) {
      .word-columns-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  `;
  
  combinedContainer.appendChild(styleElement);
  combinedContainer.appendChild(lettersSection);
  combinedContainer.appendChild(wordColumnsContainer);
  
  combinedContent.appendChild(combinedContainer);
}

// Update the toggleRevealAll function to also update length indicators
function toggleRevealAll(on) {
  document.querySelectorAll(".word-box").forEach(b => {
    const isCurrentlyRevealed = b.textContent === b.dataset.word;
    
    // Only perform the toggle if needed
    if ((on && !isCurrentlyRevealed) || (!on && isCurrentlyRevealed)) {
      b.textContent = on ? b.dataset.word : b.dataset.firsttwo;
      
      // Find and update the corresponding length icon
      const lengthIcon = document.getElementById(`length-${b.dataset.lengthIconId}`);
      if (lengthIcon) {
        const wordLength = b.dataset.word.length;
        lengthIcon.textContent = on ? invertedNumIcons[wordLength] || `[${wordLength}]` : numIcons[wordLength] || wordLength;
        
        if (on) {
          lengthIcon.classList.add('revealed');
        } else {
          lengthIcon.classList.remove('revealed');
        }
      }
    }
  });
}
</script>
</body>
</html>
