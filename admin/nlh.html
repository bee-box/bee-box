<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Helper</title>
  <style>
    body {
      font-family: monospace;
      background: #fff;
      color: #222;
      margin: 0;
      padding: 2rem;
    }
    .record-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
    .image-container {
      display: flex;
      align-items: center;
      margin-right: 1.5rem;
    }
    .chatgpt-link {
      margin-left: 0.5rem;
      font-size: 10pt;
      color: #007acc;
      text-decoration: none;
      padding: 2px 4px;
      border: 1px solid #007acc;
      border-radius: 4px;
      background: #f8f9fa;
    }
    .chatgpt-link:hover {
      background: #007acc;
      color: white;
    }
    .thumb {
      width: 20pt;
      height: 20pt;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 1.5rem;
      background: #eee;
      border: 1px solid #ccc;
    }
    .thumb-placeholder {
      width: 20pt;
      height: 20pt;
      border-radius: 8px;
      margin-right: 1.5rem;
      background: #f0f0f0;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12pt;
      color: #888;
      text-align: center;
      line-height: 1;
    }
    .xml-text {
      white-space: pre-wrap;
      font-size: 1rem;
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 8px;
      flex: 1;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h2>Puzzle XML Records (Today + Next 32 Days)</h2>
  <div id="xml-records">Loading...</div>
  <script>
    async function init() {
      try {
        const response = await fetch("../xml/puzzles.xml");
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "application/xml");
        const puzzles = [...xml.getElementsByTagName("puzzle")];
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        const endStr = getDateString(32);
        const relevant = puzzles.filter(p => {
          const d = p.getAttribute("date");
          return d >= todayStr && d <= endStr;
        });
        const container = document.getElementById("xml-records");
        container.innerHTML = '';
        relevant.forEach(p => {
          const date = p.getAttribute("date");
          const [yyyy, mm, dd] = date.split('-');
          const imgUrl = `https://bee-box.github.io/bee-box/images/${mm}-${dd}.png`;
          
          // Convert month and day to spelled out format
          const monthNames = ["January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"];
          const monthName = monthNames[parseInt(mm) - 1];
          const dayNum = parseInt(dd);
          const dayWithSuffix = getDayWithSuffix(dayNum);
          
          const row = document.createElement('div');
          row.className = 'record-row';
          
          const imageContainer = document.createElement('div');
          imageContainer.className = 'image-container';
          
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = imgUrl;
          img.alt = `${mm}-${dd}`;
          
          const placeholder = document.createElement('div');
          placeholder.className = 'thumb-placeholder';
          placeholder.innerHTML = '🖼️';
          placeholder.style.display = 'none';
          
          img.onerror = function() { 
            this.style.display = 'none';
            placeholder.style.display = 'flex';
          };
          
          // Create ChatGPT link with pre-filled prompt for immediate image generation
          const chatgptLink = document.createElement('a');
          chatgptLink.className = 'chatgpt-link';
          chatgptLink.textContent = 'AI';
          chatgptLink.target = '_blank';
          const prompt = encodeURIComponent(`Create an image. Show a bumble bee enjoying the National Day celebration for ${monthName} ${dayWithSuffix}. First look up what National Day is celebrated on ${monthName} ${dayWithSuffix} on https://www.nationaldaycalendar.com then show the bee participating in that specific celebration. Include bold text overlay: "${monthName} ${dayWithSuffix}" and the National Day name. Use bright, cheerful colors perfect for a newsletter header.`);
          chatgptLink.href = `https://chat.openai.com/?q=${prompt}`;
          
          const pre = document.createElement('div');
          pre.className = 'xml-text';
          pre.textContent = p.outerHTML;
          
          imageContainer.appendChild(img);
          imageContainer.appendChild(placeholder);
          imageContainer.appendChild(chatgptLink);
          row.appendChild(imageContainer);
          row.appendChild(pre);
          container.appendChild(row);
        });
      } catch (e) {
        document.getElementById("xml-records").textContent = "Error loading XML: " + e;
      }
    }
    function getDayWithSuffix(day) {
      if (day >= 11 && day <= 13) {
        return day + "th";
      }
      switch (day % 10) {
        case 1: return day + "st";
        case 2: return day + "nd";
        case 3: return day + "rd";
        default: return day + "th";
      }
    }
    function getDateString(daysAhead) {
      const date = new Date();
      date.setDate(date.getDate() + daysAhead);
      return date.toISOString().split('T')[0];
    }
    init();
  </script>
</body>
</html>
