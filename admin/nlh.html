<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Newsletter Maker - Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      color: #666;
      font-weight: 300;
    }

    .admin-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .content-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .missing-count {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      text-align: center;
      font-weight: 600;
      color: #8b4513;
    }

    .puzzle-grid {
      display: grid;
      gap: 1.5rem;
    }

    .puzzle-item {
      display: flex;
      align-items: center;
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .puzzle-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      border-color: #667eea;
    }

    .date-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      min-width: 120px;
      text-align: center;
      margin-right: 1.5rem;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .thumb-container {
      margin-right: 1.5rem;
      position: relative;
    }

    .thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #e9ecef;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .thumb:hover {
      transform: scale(1.1);
      border-color: #667eea;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .links-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      flex: 1;
    }

    .puzzle-link {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white !important;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      position: relative;
      overflow: hidden;
    }

    .puzzle-link:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .puzzle-link:hover:before {
      left: 100%;
    }

    .puzzle-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .puzzle-link.beesheet {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
    }

    .puzzle-link.beejumble {
      background: linear-gradient(135deg, #fd79a8, #e84393);
    }

    .puzzle-link.beepeek {
      background: linear-gradient(135deg, #fdcb6e, #e17055);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #666;
      font-size: 1.1rem;
    }

    .loading::after {
      content: "...";
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0%, 20% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    .error {
      background: linear-gradient(135deg, #ff7675, #d63031);
      color: white;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .puzzle-item {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
      }

      .date-badge, .thumb-container {
        margin-right: 0;
        margin-bottom: 1rem;
      }

      .links-container {
        justify-content: center;
      }

      .header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="admin-badge">Admin Panel</div>
      <h1>Manual Newsletter Maker</h1>
      <p>Manage and review missing puzzle entries for newsletter creation</p>
    </div>

    <div class="content-card">
      <div class="missing-count" id="missing-count" style="display: none;">
        <span id="count-text"></span>
      </div>
      
      <div class="loading" id="loading">Loading puzzle data</div>
      <div class="error" id="error" style="display: none;">
        Failed to load puzzle data. Please check the XML file path.
      </div>
      
      <div class="puzzle-grid" id="puzzle-grid">
        <!-- Puzzle items will be injected here -->
      </div>
    </div>
  </div>

  <script>
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const puzzleGrid = document.getElementById('puzzle-grid');
    const missingCount = document.getElementById('missing-count');
    const countText = document.getElementById('count-text');

    fetch("../xml/puzzles.xml")
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return response.text();
      })
      .then(xmlText => {
        loading.style.display = 'none';
        
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "application/xml");
        const puzzles = xml.querySelectorAll("puzzle");
        let missingPuzzles = 0;

        puzzles.forEach(puzzle => {
          const words = puzzle.querySelectorAll("word");
          if (words.length === 0) {
            missingPuzzles++;
            const id = puzzle.getAttribute("id");
            const date = puzzle.getAttribute("date");
            
            if (id && date) {
              const [yyyy, mm, dd] = date.split("-");
              const sheetURL = `https://bee-box.github.io/bee-box/sheet.html?puzzleid=${id}`;
              const jumbleURL = `https://bee-box.github.io/bee-box/jumble.html?puzzleid=${id}`;
              const peekURL = `https://bee-box.github.io/bee-box/peek.html?puzzleid=${id}`;
              const imgSrc = `../images/${mm}-${dd}.png`;

              const puzzleItem = document.createElement("div");
              puzzleItem.className = "puzzle-item";

              const dateBadge = document.createElement("div");
              dateBadge.className = "date-badge";
              dateBadge.textContent = date;

              const thumbContainer = document.createElement("div");
              thumbContainer.className = "thumb-container";

              const thumbLink = document.createElement("a");
              thumbLink.href = imgSrc;
              thumbLink.target = "_blank";
              thumbLink.rel = "noopener";

              const img = document.createElement("img");
              img.className = "thumb";
              img.src = imgSrc;
              img.alt = `Puzzle ${mm}-${dd}`;
              img.onerror = function() {
                this.style.display = 'none';
                thumbContainer.innerHTML = '<div style="width:60px;height:60px;background:#f8f9fa;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#6c757d;font-size:12px;">No Image</div>';
              };

              thumbLink.appendChild(img);
              thumbContainer.appendChild(thumbLink);

              const linksContainer = document.createElement("div");
              linksContainer.className = "links-container";

              const sheetLink = document.createElement("a");
              sheetLink.href = sheetURL;
              sheetLink.className = "puzzle-link beesheet";
              sheetLink.textContent = "BeeSheet";
              sheetLink.target = "_blank";

              const jumbleLink = document.createElement("a");
              jumbleLink.href = jumbleURL;
              jumbleLink.className = "puzzle-link beejumble";
              jumbleLink.textContent = "BeeJumble";
              jumbleLink.target = "_blank";

              const peekLink = document.createElement("a");
              peekLink.href = peekURL;
              peekLink.className = "puzzle-link beepeek";
              peekLink.textContent = "BeePeek";
              peekLink.target = "_blank";

              linksContainer.appendChild(sheetLink);
              linksContainer.appendChild(jumbleLink);
              linksContainer.appendChild(peekLink);

              puzzleItem.appendChild(dateBadge);
              puzzleItem.appendChild(thumbContainer);
              puzzleItem.appendChild(linksContainer);
              
              puzzleGrid.appendChild(puzzleItem);
            }
          }
        });

        if (missingPuzzles > 0) {
          countText.textContent = `Found ${missingPuzzles} puzzle${missingPuzzles === 1 ? '' : 's'} missing word data`;
          missingCount.style.display = 'block';
        } else {
          puzzleGrid.innerHTML = '<div style="text-align: center; padding: 3rem; color: #28a745; font-size: 1.2rem; font-weight: 600;">🎉 All puzzles have complete word data!</div>';
        }
      })
      .catch(err => {
        console.error("Failed to load or parse puzzles.xml:", err);
        loading.style.display = 'none';
        error.style.display = 'block';
        error.innerHTML = `<strong>Error:</strong> ${err.message}<br><small>Check console for details</small>`;
      });
  </script>
</body>
</html>
