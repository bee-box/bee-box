<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribers Only - Spelling Bee Tools</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            gap: 40px;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 500px;
        }

        .right-section {
            flex: 1;
            max-width: 700px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            width: 100%;
            overflow: hidden;
        }

        .main-title {
            text-align: center;
            color: #333;
            font-size: 18px;
            font-weight: 700;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin: 0;
        }

        .card-content {
            display: flex;
            flex-direction: column;
        }

        .date-panel {
            background: #f7da21;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .date-info {
            text-align: center;
            color: #333;
        }

        .weekday {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .month-name {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .day-num {
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 8px;
        }

        .year-num {
            font-size: 20px;
            font-weight: 600;
        }

        .content-panel {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .action-btn {
            border: 3px solid #333;
            border-radius: 12px;
            padding: 18px 28px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            display: block;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 56px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .action-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .sheet-btn {
            background: #FFDC00;
            color: #333;
        }

        .sheet-btn:hover {
            background: #e6c600;
        }

        .sheet-btn:active {
            background: #d4b800;
        }

        .jumble-btn {
            background: #8A2BE2;
            color: white;
        }

        .jumble-btn:hover {
            background: #7b27cc;
        }

        .jumble-btn:active {
            background: #6b22b3;
        }

        .peek-btn {
            background: #00B050;
            color: white;
        }

        .peek-btn:hover {
            background: #009e48;
        }

        .peek-btn:active {
            background: #008a3e;
        }

        .grid-btn {
            background: #0023FF;
            color: white;
        }

        .grid-btn:hover {
            background: #001fe6;
        }

        .grid-btn:active {
            background: #001acc;
        }

        .picker-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            width: 100%;
            text-align: center;
        }

        .picker-title {
            color: #333;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .picker-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .date-input {
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 16px;
            min-width: 200px;
            background: white;
            cursor: pointer;
            min-height: 48px;
            touch-action: manipulation;
        }

        .date-input:focus {
            outline: none;
            border-color: #FFDC00;
            box-shadow: 0 0 0 3px rgba(255, 220, 0, 0.2);
        }

        .copy-btn {
            background: #4a5568;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
            min-height: 48px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            margin-top: 20px;
        }

        .copy-btn:hover {
            background: #2d3748;
        }

        .copy-btn:active {
            background: #1a202c;
            transform: scale(0.98);
        }

        .copy-btn.success {
            background: #00B050;
        }

        .code-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            width: 100%;
        }

        .code-header {
            color: #333;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .code-block {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
        }

        @media (max-width: 1200px) {
            body {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }
            
            .left-section {
                width: 100%;
                max-width: 500px;
            }
            
            .right-section {
                width: 100%;
                max-width: 600px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
                gap: 20px;
            }
            
            .date-panel {
                padding: 30px;
            }

            .content-panel {
                padding: 30px;
            }
            
            .main-title {
                font-size: 16px;
                padding: 15px;
            }
            
            .action-btn {
                padding: 20px 24px;
                font-size: 16px;
                min-height: 60px;
                border-radius: 16px;
            }

            .picker-container,
            .code-container {
                padding: 20px;
            }

            .code-block {
                font-size: 12px;
                padding: 15px;
            }

            .date-input {
                min-width: 100%;
                width: 100%;
                font-size: 16px;
            }

            .copy-btn {
                font-size: 16px;
                padding: 16px 24px;
                min-height: 56px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .main-card {
                border-radius: 16px;
            }

            .date-panel {
                padding: 20px;
            }

            .content-panel {
                padding: 20px;
            }

            .action-btn {
                padding: 18px 20px;
                font-size: 15px;
                min-height: 56px;
                gap: 16px;
            }

            .btn-group {
                gap: 16px;
            }

            .picker-container,
            .code-container {
                padding: 16px;
                border-radius: 12px;
            }

            .day-num {
                font-size: 44px;
            }

            .month-name {
                font-size: 18px;
            }

            .weekday {
                font-size: 14px;
            }

            .year-num {
                font-size: 18px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .action-btn:hover {
                transform: none;
                box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            }
            
            .copy-btn:hover {
                background: #4a5568;
            }
        }
    </style>
</head>
<body>
    <div class="left-section">
        <!-- PREVIEW CONTAINER: This will be populated by the generated HTML -->
        <div id="previewContainer">
            <!-- The generated HTML will be inserted here -->
        </div>
    </div>

    <div class="right-section">
        <div class="picker-container">
            <h3 class="picker-title">Date Selector</h3>
            <label for="datePicker" class="picker-label">Select Date:</label>
            <input type="date" id="datePicker" class="date-input">
            <button class="copy-btn" id="copyBtn">
                Copy to Clipboard
            </button>
        </div>
        
        <div class="code-container">
            <h2 class="code-header">Ghost.org HTML Code</h2>
            
            <div class="code-block" id="codeOutput">
                Loading code snippet...
            </div>
        </div>
    </div>

    <script>
        let puzzleDatabase = {};
        
        async function loadPuzzleDatabase() {
            try {
                console.log('Loading puzzle database...');
                const response = await fetch('../../xml/puzzles.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const puzzleElements = xmlDoc.getElementsByTagName('puzzle');
                for (let puzzle of puzzleElements) {
                    const date = puzzle.getAttribute('date');
                    const id = puzzle.getAttribute('id');
                    if (date && id) {
                        puzzleDatabase[date] = id;
                    }
                }
                
                console.log(`Loaded ${Object.keys(puzzleDatabase).length} puzzles`);
                initializeDatePicker();
            } catch (error) {
                console.error('Error loading puzzle database:', error);
                initializeDatePicker();
            }
        }
        
        function initializeDatePicker() {
            const picker = document.getElementById('datePicker');
            const availableDates = Object.keys(puzzleDatabase).sort();
            
            if (availableDates.length > 0) {
                picker.min = availableDates[0];
                picker.max = availableDates[availableDates.length - 1];
            }
            
            const now = new Date();
            const centralTime = new Date(now.toLocaleString("en-US", {timeZone: "America/Chicago"}));
            const tomorrow = new Date(centralTime);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const tomorrowString = tomorrow.getFullYear() + '-' + 
                String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' + 
                String(tomorrow.getDate()).padStart(2, '0');
            
            picker.value = tomorrowString;
            
            const puzzleId = puzzleDatabase[tomorrowString] || 'idgoeshere';
            updatePreviewAndCode(tomorrowString, puzzleId);
        }

        function updatePreviewAndCode(dateString, puzzleId = 'idgoeshere') {
            let weekday = 'MONDAY', month = 'JUNE', day = '17', year = '2025';
            
            if (dateString) {
                const dateObj = new Date(dateString + 'T00:00:00');
                weekday = dateObj.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
                month = dateObj.toLocaleDateString('en-US', { month: 'long' }).toUpperCase();
                day = dateObj.getDate();
                year = dateObj.getFullYear();
            }
            
            // Generate the HTML code
            const htmlCode = '<div style="background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(0,0,0,0.1);box-shadow:0 25px 45px rgba(0,0,0,0.1);width:100%;margin:20px auto;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;overflow:hidden"><div style="text-align:center;color:#333;font-size:18px;font-weight:700;padding:20px;background:rgba(255,255,255,0.8);border-bottom:1px solid rgba(0,0,0,0.1)">Subscriber\'s Only</div><div style="padding:40px"><a href="https://bee-box.github.io/bee-box/sheet.html?puzzleid=' + puzzleId + '" style="background:#FFDC00;border:3px solid #333;border-radius:12px;padding:18px 28px;font-family:inherit;font-size:17px;font-weight:700;color:#333;text-decoration:none;display:block;width:100%;box-sizing:border-box;text-align:center;cursor:pointer;transition:all 0.2s ease;text-transform:uppercase;letter-spacing:0.5px;min-height:56px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;margin-bottom:18px" ontouchstart="this.style.background=\'#e6c600\'" ontouchend="this.style.background=\'#FFDC00\'" onmousedown="this.style.background=\'#d4b800\'" onmouseup="this.style.background=\'#FFDC00\'">Today\'s Bee Sheet</a><a href="https://bee-box.github.io/bee-box/jumble.html?puzzleid=' + puzzleId + '" style="background:#8A2BE2;border:3px solid #333;border-radius:12px;padding:18px 28px;font-family:inherit;font-size:17px;font-weight:700;color:white;text-decoration:none;display:block;width:100%;box-sizing:border-box;text-align:center;cursor:pointer;transition:all 0.2s ease;text-transform:uppercase;letter-spacing:0.5px;min-height:56px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;margin-bottom:18px" ontouchstart="this.style.background=\'#7b27cc\'" ontouchend="this.style.background=\'#8A2BE2\'" onmousedown="this.style.background=\'#6b22b3\'" onmouseup="this.style.background=\'#8A2BE2\'">Today\'s Bee Jumble</a><a href="https://bee-box.github.io/bee-box/peek.html?puzzleid=' + puzzleId + '" style="background:#00B050;border:3px solid #333;border-radius:12px;padding:18px 28px;font-family:inherit;font-size:17px;font-weight:700;color:white;text-decoration:none;display:block;width:100%;box-sizing:border-box;text-align:center;cursor:pointer;transition:all 0.2s ease;text-transform:uppercase;letter-spacing:0.5px;min-height:56px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;margin-bottom:18px" ontouchstart="this.style.background=\'#009e48\'" ontouchend="this.style.background=\'#00B050\'" onmousedown="this.style.background=\'#008a3e\'" onmouseup="this.style.background=\'#00B050\'">Today\'s Bee Peek</a><a href="https://bee-box.github.io/bee-box/grid.html?puzzleid=' + puzzleId + '" style="background:#0023FF;border:3px solid #333;border-radius:12px;padding:18px 28px;font-family:inherit;font-size:17px;font-weight:700;color:white;text-decoration:none;display:block;width:100%;box-sizing:border-box;text-align:center;cursor:pointer;transition:all 0.2s ease;text-transform:uppercase;letter-spacing:0.5px;min-height:56px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none" ontouchstart="this.style.background=\'#001fe6\'" ontouchend="this.style.background=\'#0023FF\'" onmousedown="this.style.background=\'#001acc\'" onmouseup="this.style.background=\'#0023FF\'">Today\'s Bee Grid</a></div></div>';
            
            // Update the code output
            document.getElementById('codeOutput').textContent = htmlCode;
            
            // Update the preview by inserting the HTML directly
            document.getElementById('previewContainer').innerHTML = htmlCode;
        }
        
        function copyToClipboard() {
            const codeContent = document.getElementById('codeOutput');
            const copyButton = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(codeContent.textContent).then(() => {
                showCopySuccess(copyButton);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = codeContent.textContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                showCopySuccess(copyButton);
            });
        }
        
        function showCopySuccess(button) {
            button.textContent = 'Copied!';
            button.classList.add('success');
            setTimeout(() => {
                button.textContent = 'Copy to Clipboard';
                button.classList.remove('success');
            }, 2000);
        }
        
        // Event listeners
        document.getElementById('datePicker').addEventListener('change', function() {
            const selectedDate = this.value;
            const selectedId = puzzleDatabase[selectedDate] || 'idgoeshere';
            updatePreviewAndCode(selectedDate, selectedId);
        });

        document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
        
        // Initialize the application
        loadPuzzleDatabase();
    </script>
</body>
</html>
