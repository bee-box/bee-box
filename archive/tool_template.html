<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title id="pageTitle">Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style/main.css">
  <link rel="icon" href="bee.ico" type="image/x-icon" />
</head>
<body>

<nav id="navtitle" class="section-box">
  <div class="nav-container">
    <div class="nav-left">
      <h1 id="toolNameHeading">Bee Peek</h1>
      <div id="navtitleContent" class="date-display"></div>
    </div>
    <div class="nav-right" id="navControls">
      <select id="dateSelector"><option value="">Choose a Day</option></select>
      <button id="printButton">Print</button>
      <button id="revealButton">Reveal</button>
      <a href="https://beebox.ghost.io" target="_blank">Home</a>
      <a href="#" id="subscribePopupBtn" onclick="openSubscribeModal(); return false;">Subscribe</a>
    </div>
  </div>
</nav>

<section id="header" class="section-box">
  <div id="headerContent" class="loading">Loading...</div>
</section>

<section id="letters" class="section-box">
  <div id="lettersContent" class="loading">Loading...</div>
</section>

<section id="tool" class="section-box">
  <div id="toolContent" class="loading">Loading...</div>
</section>

<footer class="section-box">
  <p>Made by Kevin Kolb · <a href="https://beebox.ghost.io" target="_blank">beebox.ghost.io</a></p>
</footer>

<div class="modal-overlay" id="subscribeOverlay">
  <div class="modal-content">
    <button class="modal-close" onclick="closeSubscribeModal()">&times;</button>
    <iframe src="https://beebox.ghost.io/subscribe/" title="Subscribe Form"></iframe>
  </div>
</div>

<script>
const toolName = "Bee Peek";
let globalWords = [];
let revealMode = false;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('pageTitle').textContent = toolName;
  document.getElementById('toolNameHeading').textContent = toolName;
  setupEventListeners();
  loadPuzzleData();
});

function openSubscribeModal() {
  document.getElementById('subscribeOverlay').style.display = 'flex';
}
function closeSubscribeModal() {
  document.getElementById('subscribeOverlay').style.display = 'none';
}

function setupEventListeners() {
  document.getElementById('dateSelector').addEventListener('change', e => {
    const d = e.target.value;
    if (d) {
      const u = new URL(window.location);
      u.searchParams.set('date', d);
      u.searchParams.delete('puzzleid');
      window.location.href = u.toString();
    }
  });
  document.getElementById('printButton').addEventListener('click', () => window.print());
  document.getElementById('revealButton').addEventListener('click', toggleRevealAll);
}

async function loadPuzzleData() {
  const toolContent = document.getElementById('toolContent');
  const lettersContent = document.getElementById('lettersContent');
  const headerContent = document.getElementById('headerContent');
  
  // Set loading state for all sections
  [toolContent, lettersContent, headerContent].forEach(el => {
    el.className = 'loading';
    el.textContent = 'Loading...';
  });

  try {
    // Fetch puzzle data once
    const res = await fetch('xml/puzzles.xml');
    const xmlText = await res.text();
    const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
    const puzzles = [...xml.querySelectorAll('puzzle')].filter(p => p.getElementsByTagName('word').length);
    const sorted = puzzles.sort((a, b) => new Date(a.getAttribute('date')) - new Date(b.getAttribute('date')));

    // Determine which puzzle to display
    const params = new URLSearchParams(window.location.search);
    const puzzleId = params.get('puzzleid');
    const date = params.get('date');

    let selected;
    const mostRecent = sorted[sorted.length - 1];

    if (puzzleId && !date) {
      selected = sorted.find(p => p.getAttribute('id') === puzzleId);
    } else if (date && !puzzleId) {
      selected = sorted.find(p => p.getAttribute('date') === date);
      if (selected === mostRecent) {
        openSubscribeModal();
        selected = sorted[sorted.length - 2];
      }
    } else {
      selected = sorted[sorted.length - 2];
    }

    // Populate date selector
    populateDateSelector(sorted, selected?.getAttribute('date'));
    
    // Display all puzzle sections
    displayPuzzle(selected);
  } catch (err) {
    // Handle errors for all sections
    [toolContent, lettersContent, headerContent].forEach(el => {
      el.className = 'error';
      el.textContent = 'Unable to load data.';
    });
  }
}
}

function populateDateSelector(puzzles, selectedDate) {
  const sel = document.getElementById('dateSelector');
  while (sel.options.length > 1) sel.remove(1);

  const reversed = [...puzzles].reverse();
  reversed.forEach(p => {
    const dateStr = p.getAttribute('date');
    const opt = document.createElement('option');
    opt.value = dateStr;
    opt.textContent = dateStr;
    if (dateStr === selectedDate) opt.selected = true;
    sel.appendChild(opt);
  });
}

function formatDateString(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

function displayPuzzle(puzzle) {
  const box = document.getElementById('toolContent');
  if (!puzzle) {
    box.className = 'error';
    box.textContent = 'No data found.';
    document.getElementById('lettersContent').className = 'error';
    document.getElementById('lettersContent').textContent = 'No data found.';
    return;
  }

  const rawDate = puzzle.getAttribute('date');
  const titleDate = formatDateString(rawDate);
  document.getElementById('navtitleContent').textContent = titleDate;
  
  // Display the letters for this puzzle
  displayLetters(puzzle);

  globalWords = [...puzzle.getElementsByTagName('word')].map(w => w.textContent).sort();
  const grouped = {};

  globalWords.forEach(word => {
    const len = word.length;
    if (!grouped[len]) grouped[len] = [];
    grouped[len].push(word);
  });

  const pangrams = puzzle.getAttribute("pangrams") || 0;
  const perfect = puzzle.getAttribute("perfectpangrams") || 0;
  const bingo = puzzle.getAttribute("bingo") === "BINGO" ? "BINGO" : "NO BINGO";
  const q = parseInt(puzzle.getAttribute("queenbee") || 0, 10);

  const headerLines = [
    `The Completely Unauthorized Games Toolbox presents the ${toolName} for ${titleDate}`,
    `Words: ${globalWords.length}, Pangrams: ${pangrams} (${perfect} Perfect), ${bingo}`,
    q ? `Good Start: ${Math.round(q * .02)}, Moving Up: ${Math.round(q * .05)}, Good: ${Math.round(q * .08)}, Solid: ${Math.round(q * .15)}, Nice: ${Math.round(q * .25)}, Great: ${Math.round(q * .4)}, Amazing: ${Math.round(q * .5)}, Genius: ${Math.round(q * .7)}, Queen Bee: ${q}` : ''
  ];

  document.getElementById('headerContent').innerHTML = headerLines.filter(Boolean).map(l => `<p>${l}</p>`).join("");
  box.className = '';
  box.innerHTML = '';
  box.classList.add('fade-in');

  Object.keys(grouped).sort((a, b) => a - b).forEach(length => {
    const h = document.createElement('h3');
    h.textContent = `${length}-Letter Words`;
    box.appendChild(h);

    const groupDiv = document.createElement('div');
    groupDiv.className = 'word-group';

    grouped[length].forEach(word => {
      const div = document.createElement('div');
      div.className = 'word-box';
      div.dataset.word = word;
      div.textContent = word.slice(0, 2);
      div.onclick = () => {
        if (div.textContent === word) {
          div.textContent = word.slice(0, 2);
        } else {
          div.textContent = word;
        }
      };
      groupDiv.appendChild(div);
    });

    box.appendChild(groupDiv);
  });

  setTimeout(() => box.classList.remove('fade-in'), 400);
}

function toggleRevealAll() {
  revealMode = !revealMode;
  document.getElementById('revealButton').textContent = revealMode ? 'Hide' : 'Reveal';
  document.querySelectorAll('.word-box').forEach(box => {
    const word = box.dataset.word;
    box.textContent = revealMode ? word : word.slice(0, 2);
  });
}
</script>

</body>
</html>
