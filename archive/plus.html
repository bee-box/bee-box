<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bee Plus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="style/bee.ico" type="image/x-icon" />
  <link rel="stylesheet" href="style/plus.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-title">Bee Plus</div>
  <div class="navbar-buttons">
    <button class="navbar-button" onclick="window.print()">🖨️ Print</button>
    <a class="navbar-button" href="https://beebox.ghost.io" target="_blank">🐝 Bee Box</a>
    <a class="navbar-button" href="https://beebox.ghost.io/#/portal" target="_blank">📬 Subscribe</a>
  </div>
</nav>

<div id="output"></div>

<script>
async function loadXML(url) {
  const response = await fetch(url);
  const text = await response.text();
  return new window.DOMParser().parseFromString(text, "application/xml");
}

async function loadText(url) {
  const response = await fetch(url);
  return response.text();
}

function renderLetters(letters) {
  return letters
    .split('')
    .map((ch, i) => i === 0 ? `<b>${ch}</b>` : ch.toUpperCase())
    .join(' ');
}

async function displayWords() {
  const xmlDoc = await loadXML('xml/puzzles.xml');
  const puzzles = Array.from(xmlDoc.getElementsByTagName('puzzle')).filter(p => p.getAttribute("letters"));
  if (puzzles.length < 2) return;

  const targetPuzzle = puzzles[puzzles.length - 2]; // Second most recent puzzle

  const puzzleDate = targetPuzzle.getAttribute('date');
  const letters = targetPuzzle.getAttribute('letters').toUpperCase();
  const center = letters[0];

  const puzzleWords = new Set(
    Array.from(targetPuzzle.getElementsByTagName('word'))
      .map(w => w.textContent.trim().toUpperCase())
  );

  const dictionaryText = await loadText('xml/dictionary.txt');
  const dictionaryWords = dictionaryText
    .split('\n')
    .map(w => w.trim().toUpperCase())
    .filter(w =>
      w.length >= 4 &&
      w.includes(center) &&
      [...w].every(ch => letters.includes(ch))
    );

  const extraWords = dictionaryWords.filter(w => !puzzleWords.has(w));

  const allWords = [
    ...Array.from(puzzleWords).map(w => ({ word: w, className: 'puzzle-word' })),
    ...extraWords.map(w => ({ word: w, className: 'extra-word' }))
  ].sort((a, b) => a.word.localeCompare(b.word));

  const output = document.getElementById('output');
  output.innerHTML = `
    <div class="subtitle">Puzzle Date: ${puzzleDate}</div>
    <div class="letters">${renderLetters(letters)}</div>
    <h3>Bee Words (${puzzleWords.size})</h3>
    <h3>Plus Words (${extraWords.length})</h3>
  `;

  const container = document.createElement('div');
  allWords.forEach(({ word, className }) => {
    const span = document.createElement('span');
    span.className = `word-box ${className}`;
    span.textContent = word;
    container.appendChild(span);
  });

  container.classList.add("word-grid");
  output.appendChild(container);
}

displayWords();
</script>

</body>
</html>
