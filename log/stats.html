<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Log Viewer</title>
    <style>
        body {
            font-family: monospace;
            line-height: 1.5;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
        }
        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .banner-button {
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbox-button {
            background-color: #7B68EE;
        }
        .toolbox-button:hover {
            background-color: #6A5ACD;
        }
        .analytics-button {
            background-color: #4285F4;
        }
        .analytics-button:hover {
            background-color: #3367D6;
        }
        .actions-button {
            background-color: #2EA44F;
        }
        .actions-button:hover {
            background-color: #22863A;
        }
        .button-icon {
            margin-right: 10px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #logContent {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 14px;
            overflow-x: auto;
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #7f8c8d;
        }
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
        }
        .log-entry:nth-child(odd) {
            background-color: #f9f9f9;
        }
        .timestamp {
            color: #8e44ad;
            font-weight: bold;
            margin-right: 10px;
            white-space: nowrap;
        }
        .status-indicator {
            display: inline-block;
            width: 80px;
            text-align: center;
            padding: 2px 5px;
            margin: 0 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status-START {
            background-color: #27ae60;
            color: white;
        }
        .status-SUCCESS {
            background-color: #27ae60;
            color: white;
        }
        .status-FAILURE {
            background-color: #e74c3c;
            color: white;
        }
        .message {
            flex-grow: 1;
        }
        .error-message {
            color: #e74c3c;
            margin: 20px 0;
            padding: 10px;
            border-left: 4px solid #e74c3c;
            background-color: #fdedeb;
        }
        input[type="text"] {
            padding: 8px;
            width: 200px;
            margin-right: 5px;
        }
        .filter-controls {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
        }
        #dateFilter {
            padding: 8px;
            width: 180px;
        }
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                gap: 5px;
            }
            .filter-controls {
                flex-direction: column;
                align-items: flex-start;
            }
            input[type="text"] {
                width: 100%;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="https://beebox.ghost.io/" target="_blank" class="banner-button toolbox-button">
            <span class="button-icon">🧰</span> Toolbox
        </a>
        <a href="https://analytics.google.com/analytics/web/#/p403067039/reports/intelligenthome" target="_blank" class="banner-button analytics-button">
            <span class="button-icon">📊</span> Analytics
        </a>
        <a href="https://github.com/bee-box/bee-box/actions/workflows/run_harvest.yaml" target="_blank" class="banner-button actions-button">
            <span class="button-icon">🚀</span> Run Actions
        </a>
    </div>
    
    <h1>Simple Log Viewer</h1>
    
    <div class="controls">
        <div class="filter-controls">
            <input type="text" id="filterInput" placeholder="Filter logs...">
            <input type="text" id="dateFilter" placeholder="Filter by date (YYYY-MM-DD)">
            <button id="clearFilterBtn">Clear</button>
            <button id="refreshBtn">Refresh</button>
            <button id="autoRefreshBtn">Auto-Refresh</button>
        </div>
        <div class="status" id="statusMessage">Ready</div>
    </div>
    
    <div id="logContent">Loading logs...</div>

    <script>
        // Configuration
        const logFilePath = 'log.txt';
        const refreshInterval = 30000; // 30 seconds
        
        // State variables
        let autoRefreshEnabled = false;
        let autoRefreshTimer = null;
        let rawLogData = '';
        
        // DOM elements
        const logContent = document.getElementById('logContent');
        const statusMessage = document.getElementById('statusMessage');
        const refreshBtn = document.getElementById('refreshBtn');
        const autoRefreshBtn = document.getElementById('autoRefreshBtn');
        const filterInput = document.getElementById('filterInput');
        const dateFilter = document.getElementById('dateFilter');
        const clearFilterBtn = document.getElementById('clearFilterBtn');
        
        // Load and display logs
        async function loadLogs() {
            try {
                statusMessage.textContent = 'Loading logs...';
                refreshBtn.disabled = true;
                
                const response = await fetch(logFilePath + '?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`Failed to load log file: ${response.status} ${response.statusText}`);
                }
                
                rawLogData = await response.text();
                
                // Display logs with current filters
                displayFilteredLogs();
                
                statusMessage.textContent = `Last updated: ${new Date().toLocaleString()}`;
                refreshBtn.disabled = false;
                
            } catch (error) {
                console.error('Error loading logs:', error);
                logContent.innerHTML = `<div class="error-message">
                    <p>Error loading log file: ${error.message}</p>
                    <p>Make sure log.txt exists in the same folder as this HTML file.</p>
                </div>`;
                statusMessage.textContent = `Error: ${error.message}`;
                refreshBtn.disabled = false;
            }
        }
        
        // Display logs with filtering
        function displayFilteredLogs() {
            if (!rawLogData) {
                logContent.textContent = 'No log data available.';
                return;
            }
            
            const filterText = filterInput.value.toLowerCase();
            const dateText = dateFilter.value;
            
            // Split logs into lines and prepare for display
            const lines = rawLogData.split('\n');
            const logEntries = [];
            
            // Skip header line
            let isHeaderLine = true;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Skip empty lines
                if (!line) continue;
                
                // Skip header line
                if (isHeaderLine) {
                    isHeaderLine = false;
                    continue;
                }
                
                // Check if line matches filters
                if ((!filterText || line.toLowerCase().includes(filterText)) &&
                    (!dateText || line.includes(dateText))) {
                    
                    // Parse CSV line: TIMESTAMP,STATUS,MESSAGE
                    const commaIndex = line.indexOf(',');
                    if (commaIndex === -1) {
                        // Malformed line
                        logEntries.push(`<div class="log-entry">${line}</div>`);
                        continue;
                    }
                    
                    const timestamp = line.substring(0, commaIndex);
                    
                    const restOfLine = line.substring(commaIndex + 1);
                    const secondCommaIndex = restOfLine.indexOf(',');
                    if (secondCommaIndex === -1) {
                        // Malformed line
                        logEntries.push(`<div class="log-entry">${line}</div>`);
                        continue;
                    }
                    
                    const status = restOfLine.substring(0, secondCommaIndex);
                    let message = restOfLine.substring(secondCommaIndex + 1);
                    
                    // Remove quotes if present
                    if (message.startsWith('"') && message.endsWith('"')) {
                        message = message.substring(1, message.length - 1);
                    }
                    
                    logEntries.push(`
                        <div class="log-entry">
                            <span class="timestamp">${timestamp}</span>
                            <span class="status-indicator status-${status}">${status}</span>
                            <span class="message">${message}</span>
                        </div>
                    `);
                }
            }
            
            // Reverse entries to show newest first
            logEntries.reverse();
            
            // Show results or no matches message
            if (logEntries.length > 0) {
                logContent.innerHTML = logEntries.join('');
            } else {
                logContent.innerHTML = `<div class="error-message">No log entries match your filters.</div>`;
            }
        }
        
        // Toggle auto-refresh
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            
            if (autoRefreshEnabled) {
                autoRefreshBtn.textContent = 'Stop Auto-Refresh';
                autoRefreshBtn.style.backgroundColor = '#e74c3c';
                autoRefreshTimer = setInterval(loadLogs, refreshInterval);
                statusMessage.textContent = `Auto-refresh enabled (every ${refreshInterval/1000} seconds)`;
            } else {
                autoRefreshBtn.textContent = 'Auto-Refresh';
                autoRefreshBtn.style.backgroundColor = '#3498db';
                clearInterval(autoRefreshTimer);
                statusMessage.textContent = 'Auto-refresh disabled';
            }
        }
        
        // Event listeners
        refreshBtn.addEventListener('click', loadLogs);
        autoRefreshBtn.addEventListener('click', toggleAutoRefresh);
        
        filterInput.addEventListener('input', displayFilteredLogs);
        dateFilter.addEventListener('input', displayFilteredLogs);
        clearFilterBtn.addEventListener('click', function() {
            filterInput.value = '';
            dateFilter.value = '';
            displayFilteredLogs();
        });
        
        // Initialize
        loadLogs();
    </script>
</body>
</html>
