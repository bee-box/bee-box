<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Toolbox Log Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            --primary-color: #33ff00;
            --primary-dim: #1a8000;
            --terminal-bg: #000000;
            --terminal-border: #33ff00;
            --dark-terminal: #001000;
            --light-terminal: #002800;
            --warning-color: #ff8c00;
            --danger-color: #ff0000;
            --glow: 0 0 10px rgba(51, 255, 0, 0.7), 0 0 5px rgba(51, 255, 0, 0.4);
            --soft-glow: 0 0 5px rgba(51, 255, 0, 0.5);
            --border-radius: 0;
            --spacing-sm: 5px;
            --spacing-md: 10px;
            --spacing-lg: 15px;
            --spacing-xl: 20px;
        }
        
        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100%);
            }
        }
        
        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }
        
        @keyframes textflicker {
            0%, 100% { text-shadow: var(--glow); }
            50% { text-shadow: var(--soft-glow); }
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: var(--glow); }
            50% { box-shadow: var(--soft-glow); }
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'VT323', monospace;
            line-height: 1.5;
            margin: 0;
            background-color: var(--terminal-bg);
            color: var(--primary-color);
            font-size: 16px;
            overflow-x: hidden;
            text-shadow: var(--soft-glow);
            padding: var(--spacing-md);
        }
        
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(to bottom, 
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 50, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.15;
        }
        
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0.5;
            z-index: 3;
            pointer-events: none;
        }
        
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(
                to bottom,
                rgba(51, 255, 0, 0) 0%,
                rgba(51, 255, 0, 0.1) 50%,
                rgba(51, 255, 0, 0) 100%
            );
            z-index: 998;
            opacity: 0.6;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: var(--spacing-lg);
            text-align: center;
            letter-spacing: 2px;
            animation: textflicker 3s linear infinite;
            text-transform: uppercase;
        }
        
        h1::before {
            content: "// ";
        }
        
        h1::after {
            content: " //";
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
            border: 2px solid var(--terminal-border);
            background-color: rgba(0, 10, 0, 0.7);
            box-shadow: var(--glow);
            animation: pulse 4s ease-in-out infinite;
        }
        
        .top-bar {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .banner-button {
            color: var(--primary-color);
            padding: var(--spacing-lg);
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-terminal);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .banner-button:hover {
            background-color: var(--light-terminal);
            box-shadow: var(--glow);
        }
        
        .button-icon {
            margin-right: var(--spacing-md);
        }
        
        .controls {
            margin-bottom: var(--spacing-lg);
            border: 1px solid var(--primary-color);
            padding: var(--spacing-md);
            background-color: var(--dark-terminal);
        }
        
        button {
            background-color: var(--dark-terminal);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px var(--spacing-lg);
            cursor: pointer;
            font-size: 16px;
            margin-right: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
            min-height: 40px;
            width: 100%;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        
        button:hover {
            background-color: var(--primary-color);
            color: var(--terminal-bg);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #logContent {
            background-color: var(--dark-terminal);
            padding: var(--spacing-lg);
            border: 1px solid var(--primary-color);
            font-size: 16px;
            overflow-x: auto;
            height: calc(100vh - 300px);
            min-height: 250px;
            position: relative;
        }
        
        #logContent::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to bottom, var(--primary-dim) 0%, transparent 100%);
            opacity: 0.2;
            pointer-events: none;
        }
        
        #logContent::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to top, var(--primary-dim) 0%, transparent 100%);
            opacity: 0.2;
            pointer-events: none;
        }
        
        .status {
            margin-top: var(--spacing-md);
            font-style: italic;
            color: var(--primary-dim);
            font-size: 1rem;
        }
        
        .status::before {
            content: "[ ";
        }
        
        .status::after {
            content: " ]";
        }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--primary-color);
            animation: blink 1s step-start infinite;
            margin-left: 5px;
            vertical-align: middle;
        }
        
        .log-entry {
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(51, 255, 0, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .log-entry:hover {
            background-color: rgba(51, 255, 0, 0.05);
        }
        
        .log-entry-header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }
        
        .timestamp {
            color: #52ff52;
            font-weight: bold;
            margin-right: var(--spacing-md);
            white-space: nowrap;
            font-size: 1rem;
        }
        
        .timestamp::before {
            content: "[";
        }
        
        .timestamp::after {
            content: "]";
        }
        
        .status-indicator {
            display: inline-block;
            min-width: 80px;
            text-align: center;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid;
            text-transform: uppercase;
        }
        
        .status-INFO {
            color: #52ff52;
            border-color: #52ff52;
        }
        
        .status-START {
            color: #ffcc00;
            border-color: #ffcc00;
        }
        
        .status-FAILURE {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
        
        .message {
            width: 100%;
            word-break: break-word;
            padding-left: 20px;
        }
        
        .message::before {
            content: "> ";
            color: var(--primary-dim);
        }
        
        .error-message {
            color: var(--danger-color);
            margin: var(--spacing-xl) 0;
            padding: var(--spacing-md);
            border: 1px solid var(--danger-color);
            background-color: rgba(255, 0, 0, 0.1);
        }
        
        input[type="text"] {
            padding: 10px;
            width: 100%;
            margin-bottom: var(--spacing-md);
            border: 1px solid var(--primary-color);
            background-color: var(--dark-terminal);
            color: var(--primary-color);
            font-size: 16px;
            min-height: 40px;
            font-family: 'VT323', monospace;
        }
        
        input[type="text"]::placeholder {
            color: rgba(51, 255, 0, 0.5);
        }
        
        input[type="text"]:focus {
            outline: none;
            box-shadow: var(--soft-glow);
        }
        
        .filter-controls {
            margin-bottom: var(--spacing-md);
            display: flex;
            flex-direction: column;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        .logo {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-shadow: var(--glow);
        }
        
        .logo span {
            color: var(--danger-color);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }
        
        /* Media queries for larger screens */
        @media (min-width: 768px) {            
            .top-bar {
                flex-direction: row;
                gap: var(--spacing-lg);
            }
            
            .banner-button {
                flex: 1;
                font-size: 18px;
            }
            
            .filter-controls {
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--spacing-sm);
            }
            
            input[type="text"] {
                margin-right: var(--spacing-sm);
                margin-bottom: 0;
                width: auto;
            }
            
            #filterInput {
                width: 200px;
            }
            
            #dateFilter {
                width: 180px;
            }
            
            button {
                width: auto;
                margin-bottom: 0;
            }
            
            .action-buttons {
                display: inline-block;
            }
            
            .log-entry {
                flex-direction: row;
                align-items: center;
            }
            
            .log-entry-header {
                margin-bottom: 0;
                width: auto;
            }
            
            .message {
                padding-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <div class="container">
        <div class="logo animate__animated animate__fadeIn">Games Toolbox Log <span>Terminal</span></div>
        
        <h1 class="animate__animated animate__fadeInDown">Shall we play a game?</h1>
        
        <div class="top-bar animate__animated animate__fadeInUp">
            <a href="https://beebox.ghost.io/" target="_blank" class="banner-button toolbox-button">
                <span class="button-icon">⚙️</span> GAMES TOOLBOX
            </a>
            <a href="https://analytics.google.com/analytics/web/#/p403067039/reports/intelligenthome" target="_blank" class="banner-button analytics-button">
                <span class="button-icon">📈</span> ANALYTICS
            </a>
            <a href="https://github.com/bee-box/bee-box/actions/workflows/run_harvest.yaml" target="_blank" class="banner-button actions-button">
                <span class="button-icon">🔄</span> EXECUTE
            </a>
        </div>
        
        <div class="controls animate__animated animate__fadeIn">
            <div class="filter-controls">
                <input type="text" id="filterInput" placeholder="SEARCH QUERY...">
                <input type="text" id="dateFilter" placeholder="DATE (YYYY-MM-DD)">
                <div class="action-buttons">
                    <button id="clearFilterBtn">CLEAR</button>
                    <button id="refreshBtn">REFRESH</button>
                    <button id="autoRefreshBtn">AUTO-REFRESH</button>
                </div>
            </div>
            <div class="status" id="statusMessage">SYSTEM READY<span class="cursor"></span></div>
        </div>
        
        <div id="logContent" class="animate__animated animate__fadeIn">INITIALIZING LOG DATABASE...</div>
    </div>

    <script>
        // Define DOM elements
        const refreshBtn = document.getElementById('refreshBtn');
        const autoRefreshBtn = document.getElementById('autoRefreshBtn');
        const filterInput = document.getElementById('filterInput');
        const dateFilter = document.getElementById('dateFilter');
        const clearFilterBtn = document.getElementById('clearFilterBtn');
        const statusMessage = document.getElementById('statusMessage');
        const logContent = document.getElementById('logContent');
        
        // Configuration
        const logFilePath = 'logs.txt'; // Replace with actual path to your log file
        let refreshInterval = 30000; // 30 seconds
        let autoRefreshEnabled = false;
        let autoRefreshTimer;
        let rawLogData = '';
        
// Function to parse CSV log format
function parseLogFile(rawLogText) {
    const logs = [];
    const lines = rawLogText.trim().split('\n');
    
    for (const line of lines) {
        // CSV parsing with regex to handle quoted fields
        const match = line.match(/^([^,]+),([^,]+),"(.+)"$/);
        if (match) {
            logs.push({
                timestamp: match[1],
                status: match[2],
                message: match[3]
            });
        }
    }
    
    return logs;
}

// Sample raw log text (from logs.txt)
const rawLogText = `2025-05-18 01:11:55 AM CDT,START,"Harvest process started"
2025-05-18 01:11:55 AM CDT,INFO,"Skipping backup - current file (2090075 bytes) is not larger than backup (2090075 bytes)"
2025-05-18 01:11:55 AM CDT,INFO,"Fetching puzzle from NYT (attempt 1/3)"
2025-05-18 01:11:55 AM CDT,INFO,"Successfully fetched puzzle for 2025-05-17 with 65 words"
2025-05-18 01:11:55 AM CDT,SUCCESS,"Harvest process completed - puzzle already exists"`;

// Parse the raw log text into structured log objects
const sampleLogs = parseLogFile(rawLogText);
        
        // Event listeners
        refreshBtn.addEventListener('click', loadLogs);
        autoRefreshBtn.addEventListener('click', toggleAutoRefresh);
        
        filterInput.addEventListener('input', displayFilteredLogs);
        dateFilter.addEventListener('input', displayFilteredLogs);
        clearFilterBtn.addEventListener('click', function() {
            filterInput.value = '';
            dateFilter.value = '';
            displayFilteredLogs();
        });
        
        // Add touch event listeners for better mobile experience
        document.querySelectorAll('button, .banner-button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.style.opacity = '0.7';
            });
            
            button.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });
        
        // Function to display filtered logs
        function displayFilteredLogs() {
            const filterText = filterInput.value.toLowerCase();
            const dateText = dateFilter.value;
            
            let filteredLogs = sampleLogs;
            
            // Apply filters if they exist
            if (filterText || dateText) {
                filteredLogs = sampleLogs.filter(log => {
                    const matchesFilter = filterText ? 
                        (log.message.toLowerCase().includes(filterText) || 
                         log.status.toLowerCase().includes(filterText) ||
                         log.timestamp.toLowerCase().includes(filterText)) : true;
                    
                    const matchesDate = dateText ? 
                        log.timestamp.includes(dateText) : true;
                    
                    return matchesFilter && matchesDate;
                });
            }
            
            // Render logs
            if (filteredLogs.length === 0) {
                logContent.innerHTML = `<div class="error-message">
                    <p>** NO MATCHING LOGS FOUND **</p>
                    <p>TRY ADJUSTING YOUR FILTER CRITERIA.</p>
                </div>`;
            } else {
                logContent.innerHTML = '';
                filteredLogs.forEach(log => {
                    const logEntry = document.createElement('div');
                    logEntry.classList.add('log-entry');
                    
                    const logHeader = document.createElement('div');
                    logHeader.classList.add('log-entry-header');
                    
                    const timestamp = document.createElement('div');
                    timestamp.classList.add('timestamp');
                    timestamp.textContent = log.timestamp;
                    
                    const statusIndicator = document.createElement('div');
                    statusIndicator.classList.add('status-indicator', `status-${log.status}`);
                    statusIndicator.textContent = log.status;
                    
                    const message = document.createElement('div');
                    message.classList.add('message');
                    message.textContent = log.message;
                    
                    logHeader.appendChild(timestamp);
                    logHeader.appendChild(statusIndicator);
                    logEntry.appendChild(logHeader);
                    logEntry.appendChild(message);
                    
                    logContent.appendChild(logEntry);
                });
            }
            
            // Update status
            const filterActive = filterText || dateText;
            if (filterActive) {
                typeWriter(statusMessage, `FILTERED: ${filteredLogs.length} RESULTS`);
            } else {
                typeWriter(statusMessage, `DISPLAYING ${filteredLogs.length} LOG ENTRIES`);
            }
        }
        
        // Typewriter effect for status messages
        function typeWriter(element, text, speed = 50) {
            element.innerHTML = "";
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML += '<span class="cursor"></span>';
                }
            }
            
            type();
        }
        
        // Toggle auto-refresh
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            
            if (autoRefreshEnabled) {
                autoRefreshBtn.textContent = 'STOP AUTO-REFRESH';
                autoRefreshBtn.style.color = '#ff0000';
                autoRefreshBtn.style.borderColor = '#ff0000';
                autoRefreshTimer = setInterval(loadLogs, refreshInterval);
                typeWriter(statusMessage, `AUTO-REFRESH ACTIVE (${refreshInterval/1000}s)`);
            } else {
                autoRefreshBtn.textContent = 'AUTO-REFRESH';
                autoRefreshBtn.style.color = '';
                autoRefreshBtn.style.borderColor = '';
                clearInterval(autoRefreshTimer);
                typeWriter(statusMessage, 'AUTO-REFRESH DISABLED');
            }
        }
        
        // Add functionality to read log files from the user's system
        function readLogFromFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => resolve(event.target.result);
                reader.onerror = (error) => reject(error);
                reader.readAsText(file);
            });
        }
        
        // Create a file input element for uploading logs
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.txt,.log,.csv';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);
        
        // Create a button to trigger the file picker
        const uploadButton = document.createElement('button');
        uploadButton.textContent = 'UPLOAD LOG';
        uploadButton.addEventListener('click', () => fileInput.click());
        
        // Add the upload button to the action buttons
        const actionButtons = document.querySelector('.action-buttons');
        actionButtons.appendChild(uploadButton);
        
        // Process uploaded log file
        fileInput.addEventListener('change', async (event) => {
            if (event.target.files.length > 0) {
                try {
                    typeWriter(statusMessage, 'READING LOG FILE...');
                    const file = event.target.files[0];
                    const content = await readLogFromFile(file);
                    const parsedLogs = parseLogFile(content);
                    
                    if (parsedLogs.length > 0) {
                        // Replace our sample logs with the uploaded ones
                        while (sampleLogs.length > 0) {
                            sampleLogs.pop();
                        }
                        parsedLogs.forEach(log => sampleLogs.push(log));
                        
                        displayFilteredLogs();
                        typeWriter(statusMessage, `LOADED ${parsedLogs.length} LOG ENTRIES FROM ${file.name}`);
                    } else {
                        typeWriter(statusMessage, 'ERROR: NO VALID LOG ENTRIES FOUND');
                    }
                } catch (error) {
                    console.error('Error processing log file:', error);
                    typeWriter(statusMessage, 'ERROR PROCESSING LOG FILE');
                }
            }
        });
        
        // Load and display logs with retro terminal effects
        async function loadLogs() {
            try {
                typeWriter(statusMessage, 'ACCESSING LOG DATABASE...');
                refreshBtn.disabled = true;
                
                // Simulate slight delay for retro terminal feel
                await new Promise(resolve => setTimeout(resolve, 800));
                
                // In a real application, you would fetch actual log data from a file
                // For this demo, we could simulate parsing a log file:
                logContent.innerHTML = '<div class="loading-text">DOWNLOADING LOG DATA...</div>';
                await new Promise(resolve => setTimeout(resolve, 600));
                logContent.innerHTML = '<div class="loading-text">DECRYPTING CONTENTS...</div>';
                await new Promise(resolve => setTimeout(resolve, 400));
                
                // Add a new log entry with current timestamp for demonstration
                const now = new Date();
                const options = { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit',
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true
                };
                const formattedTime = now.toLocaleString('en-US', options).replace(',', '');
                sampleLogs.push({
                    timestamp: formattedTime,
                    status: 'INFO',
                    message: `Log file refreshed at ${formattedTime}`
                });
                
                // Display logs with current filters
                displayFilteredLogs();
                
                const nowString = now.toLocaleString();
                typeWriter(statusMessage, `LAST UPDATE: ${nowString}`);
                refreshBtn.disabled = false;
                
            } catch (error) {
                console.error('Error loading logs:', error);
                logContent.innerHTML = `<div class="error-message">
                    <p>** ACCESS DENIED **</p>
                    <p>ERROR: ${error.message}</p>
                    <p>VERIFY LOG DATABASE EXISTS AND IS ACCESSIBLE.</p>
                </div>`;
                typeWriter(statusMessage, `SYSTEM ERROR`);
                refreshBtn.disabled = false;
            }
        }
        
        // Add retro terminal boot sequence
        function simulateBootSequence() {
            const bootMessages = [
                "INITIALIZING WOPR TERMINAL...",
                "ESTABLISHING CONNECTION...",
                "SECURITY CLEARANCE: VERIFIED",
                "LOADING LOG DATABASE...",
                "WELCOME TO WOPR LOG TERMINAL"
            ];
            
            logContent.innerHTML = "";
            typeWriter(statusMessage, "BOOTING SYSTEM");
            
            bootMessages.forEach((message, index) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.classList.add('log-entry');
                    div.innerHTML = `<span class="message">${message}</span>`;
                    logContent.appendChild(div);
                    
                    // After last boot message, load the actual logs
                    if (index === bootMessages.length - 1) {
                        setTimeout(loadLogs, 800);
                    }
                }, index * 600);
            });
        }
        
        // Initialize with boot sequence
        simulateBootSequence();
    </script>
</body>
</html>
