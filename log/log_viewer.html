<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .controls {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background-color: white;
            min-width: 200px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .log-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: auto;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .timestamp {
            color: #7f8c8d;
            margin-right: 10px;
        }
        .log-level {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 10px;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }
        .level-START, .level-INFO {
            background-color: #e8f4f8;
            color: #3498db;
        }
        .level-END, .level-SUCCESS {
            background-color: #e8f8e8;
            color: #27ae60;
        }
        .level-WARNING {
            background-color: #fef9e7;
            color: #f39c12;
        }
        .level-ERROR {
            background-color: #fdedeb;
            color: #e74c3c;
        }
        .message {
            display: inline;
        }
        .emoji {
            margin-right: 5px;
        }
        .workflow-group {
            border-left: 3px solid #3498db;
            padding-left: 15px;
            margin-bottom: 20px;
        }
        .workflow-header {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .summary {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .summary-item {
            background-color: #f8f9fa;
            padding: 8px 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .summary-count {
            font-weight: bold;
            color: #3498db;
        }
        .no-logs {
            padding: 30px;
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #95a5a6;
        }
        .separator {
            border-top: 1px dashed #ddd;
            margin: 15px 0;
        }
        .error-message {
            background-color: #fdedeb;
            color: #e74c3c;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #3498db;
        }
        .last-updated {
            margin-left: auto;
            color: #7f8c8d;
            font-size: 14px;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
        }
        .auto-refresh label {
            font-size: 14px;
            color: #7f8c8d;
        }
        .log-filter {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .filter-button {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .filter-button.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
        .filter-button:hover {
            background-color: #f5f5f5;
        }
        .filter-button.active:hover {
            background-color: #2980b9;
        }
        .search-container {
            margin-top: 15px;
            margin-bottom: 15px;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        .highlight {
            background-color: yellow;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Log Viewer</h1>
    
    <div class="controls">
        <select id="dateSelector">
            <option value="">Select a date</option>
        </select>
        <button id="refreshButton">Refresh</button>
        
        <div class="auto-refresh">
            <input type="checkbox" id="autoRefreshToggle">
            <label for="autoRefreshToggle">Auto-refresh (<span id="autoRefreshStatus">off</span>)</label>
        </div>
    </div>
    
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search logs...">
    </div>
    
    <div class="log-filter" id="logFilter">
        <button class="filter-button active" data-level="all">All</button>
        <button class="filter-button" data-level="INFO">Info</button>
        <button class="filter-button" data-level="WARNING">Warning</button>
        <button class="filter-button" data-level="ERROR">Error</button>
        <button class="filter-button" data-level="SUCCESS">Success</button>
    </div>
    
    <div class="log-container" id="logDisplay">
        <div class="loading">
            Loading logs...
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Configuration
            const logFilePath = 'log.txt'; // Path to log file in the same folder
            const autoRefreshInterval = 60000; // Auto refresh logs every 60 seconds
            
            // State variables
            let logData = '';
            let parsedLogs = [];
            let groupedLogs = {};
            let isLoading = false;
            
            // Load logs from the server
            async function loadLogData() {
                if (isLoading) return;
                
                isLoading = true;
                document.getElementById('refreshButton').textContent = 'Loading...';
                document.getElementById('logDisplay').innerHTML = '<div class="loading">Loading logs...</div>';
                
                try {
                    const response = await fetch(logFilePath);
                    
                    if (!response.ok) {
                        throw new Error(`Failed to load log file: ${response.status} ${response.statusText}`);
                    }
                    
                    logData = await response.text();
                    parsedLogs = parseLogData(logData);
                    groupedLogs = groupLogsByDate(parsedLogs);
                    
                    populateDateSelector(groupedLogs);
                    
                    // Display logs for the most recent date
                    const dates = Object.keys(groupedLogs).sort().reverse();
                    if (dates.length > 0) {
                        document.getElementById('dateSelector').value = dates[0];
                        const selectedFilter = document.querySelector('.filter-button.active').getAttribute('data-level');
                        const searchTerm = document.getElementById('searchInput').value;
                        displayLogsForDate(dates[0], groupedLogs, selectedFilter, searchTerm);
                    } else {
                        document.getElementById('logDisplay').innerHTML = '<div class="no-logs">No logs found in log.txt</div>';
                    }
                    
                    document.getElementById('refreshButton').textContent = 'Refresh';
                    
                    // Show last updated time
                    const lastUpdatedEl = document.querySelector('.last-updated');
                    if (lastUpdatedEl) {
                        lastUpdatedEl.textContent = `Last updated: ${new Date().toLocaleString()}`;
                    } else {
                        const lastUpdated = document.createElement('div');
                        lastUpdated.className = 'last-updated';
                        lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;
                        document.querySelector('.controls').appendChild(lastUpdated);
                    }
                    
                } catch (error) {
                    console.error('Error loading log data:', error);
                    document.getElementById('logDisplay').innerHTML = `
                        <div class="error-message">
                            <p>Error loading log file: ${error.message}</p>
                            <p>Make sure the log.txt file exists and is accessible.</p>
                        </div>
                    `;
                    document.getElementById('refreshButton').textContent = 'Retry';
                } finally {
                    isLoading = false;
                }
            }
            
            // Parse the log data
            function parseLogData(logText) {
                const logEntries = [];
                const lines = logText.split('\n');
                
                // Process each line
                lines.forEach(line => {
                    if (line.trim() === '' || line.startsWith('────────')) return;
                    
                    let entry = {};
                    
                    // Parse CSV formatted lines
                    if (line.match(/^\d{14},/)) {
                        const parts = line.split(',');
                        const timestamp = parts[1];
                        const date = timestamp.split(' ')[0];
                        const time = timestamp.split(' ')[1];
                        const component = parts[2];
                        const level = parts[3];
                        
                        // Extract the message which might contain commas
                        let message = parts.slice(4).join(',');
                        if (message.startsWith('"') && message.endsWith('"')) {
                            message = message.substring(1, message.length - 1);
                        }
                        
                        entry = {
                            timestamp,
                            date,
                            time,
                            component,
                            level,
                            message,
                            format: 'csv'
                        };
                    } 
                    // Parse bracketed timestamp format
                    else if (line.match(/^\[\d{4}-\d{2}-\d{2}/)) {
                        const timestampMatch = line.match(/^\[([\d-]+ [\d:]+)(?:.*?)\]/);
                        const timestamp = timestampMatch ? timestampMatch[1] : '';
                        const date = timestamp.split(' ')[0];
                        
                        let level = 'INFO';
                        if (line.includes('[START]') || line.includes('START')) level = 'START';
                        else if (line.includes('[END]') || line.includes('END')) level = 'END';
                        else if (line.includes('[INFO]')) level = 'INFO';
                        else if (line.includes('[WARNING]') || line.includes('⚠️')) level = 'WARNING';
                        else if (line.includes('[ERROR]')) level = 'ERROR';
                        
                        // Extract emoji if present
                        const emojiMatch = line.match(/[^\w\s,.()\[\]]/g);
                        const emoji = emojiMatch ? emojiMatch[0] : '';
                        
                        // Clean up the message
                        let message = line.replace(/^\[[\d-]+ [\d:]+(?:.*?)\]/, '').trim();
                        if (message.startsWith('[')) {
                            message = message.replace(/^\[(.*?)\]/, '').trim();
                        }
                        
                        entry = {
                            timestamp,
                            date,
                            level,
                            message,
                            emoji,
                            format: 'bracketed'
                        };
                    }
                    
                    if (Object.keys(entry).length > 0) {
                        logEntries.push(entry);
                    }
                });
                
                return logEntries;
            }

            // Group log entries by date
            function groupLogsByDate(logs) {
                const groupedLogs = {};
                
                logs.forEach(log => {
                    if (!log.date) return;
                    
                    if (!groupedLogs[log.date]) {
                        groupedLogs[log.date] = [];
                    }
                    
                    groupedLogs[log.date].push(log);
                });
                
                return groupedLogs;
            }

            // Populate date selector
            function populateDateSelector(groupedLogs) {
                const selector = document.getElementById('dateSelector');
                selector.innerHTML = '<option value="">Select a date</option>';
                
                const dates = Object.keys(groupedLogs).sort().reverse();
                
                dates.forEach(date => {
                    const option = document.createElement('option');
                    option.value = date;
                    option.textContent = date;
                    selector.appendChild(option);
                });
                
                // Set the latest date as selected
                if (dates.length > 0) {
                    selector.value = dates[0];
                    const selectedFilter = document.querySelector('.filter-button.active').getAttribute('data-level');
                    const searchTerm = document.getElementById('searchInput').value;
                    displayLogsForDate(dates[0], groupedLogs, selectedFilter, searchTerm);
                }
            }

            // Display logs for a selected date with optional filtering and search
            function displayLogsForDate(date, groupedLogs, filterLevel = 'all', searchTerm = '') {
                const logDisplay = document.getElementById('logDisplay');
                logDisplay.innerHTML = '';
                
                if (!date || !groupedLogs[date] || groupedLogs[date].length === 0) {
                    logDisplay.innerHTML = '<div class="no-logs">No logs available for this date</div>';
                    return;
                }
                
                const logs = groupedLogs[date];
                
                // Group logs by workflow ID (first number in CSV format)
                const workflowGroups = {};
                logs.forEach(log => {
                    if (log.format === 'csv') {
                        const workflowId = log.timestamp.split(' ')[0];
                        if (!workflowGroups[workflowId]) {
                            workflowGroups[workflowId] = [];
                        }
                        workflowGroups[workflowId].push(log);
                    }
                });
                
                // Create counters for summary
                let infoCount = 0;
                let warningCount = 0;
                let errorCount = 0;
                let successCount = 0;
                
                // Normalize search term
                const normalizedSearchTerm = searchTerm.toLowerCase().trim();
                
                // Process each workflow group
                Object.keys(workflowGroups).forEach(workflowId => {
                    const workflowDiv = document.createElement('div');
                    workflowDiv.className = 'workflow-group';
                    
                    const workflowHeader = document.createElement('div');
                    workflowHeader.className = 'workflow-header';
                    workflowHeader.textContent = `Workflow ${workflowId} - ${date}`;
                    workflowDiv.appendChild(workflowHeader);
                    
                    const workflowLogs = workflowGroups[workflowId];
                    let workflowHasVisibleLogs = false;
                    
                    // Process each log in this workflow
                    workflowLogs.forEach(log => {
                        // Update counters
                        if (log.level === 'INFO') infoCount++;
                        else if (log.level === 'WARNING') warningCount++;
                        else if (log.level === 'ERROR') errorCount++;
                        else if (log.level === 'SUCCESS') successCount++;
                        
                        // Skip if not matching filter
                        if (filterLevel !== 'all' && log.level !== filterLevel) {
                            return;
                        }
                        
                        // Skip if not matching search
                        if (normalizedSearchTerm && 
                            !log.message.toLowerCase().includes(normalizedSearchTerm) && 
                            !log.level.toLowerCase().includes(normalizedSearchTerm) && 
                            !(log.component && log.component.toLowerCase().includes(normalizedSearchTerm))) {
                            return;
                        }
                        
                        workflowHasVisibleLogs = true;
                        
                        const logEntry = document.createElement('div');
                        logEntry.className = 'log-entry';
                        
                        // Format timestamp
                        const timestamp = document.createElement('span');
                        timestamp.className = 'timestamp';
                        timestamp.textContent = log.time || log.timestamp;
                        logEntry.appendChild(timestamp);
                        
                        // Format log level
                        const levelSpan = document.createElement('span');
                        levelSpan.className = `log-level level-${log.level}`;
                        levelSpan.textContent = log.level;
                        logEntry.appendChild(levelSpan);
                        
                        // Format message with emoji if present
                        const messageSpan = document.createElement('span');
                        messageSpan.className = 'message';
                        
                        if (log.emoji) {
                            const emojiSpan = document.createElement('span');
                            emojiSpan.className = 'emoji';
                            emojiSpan.textContent = log.emoji;
                            messageSpan.appendChild(emojiSpan);
                        }
                        
                        // Highlight search term if present
                        if (normalizedSearchTerm) {
                            const messageText = log.message;
                            const searchRegExp = new RegExp(normalizedSearchTerm, 'gi');
                            const highlightedText = messageText.replace(searchRegExp, match => 
                                `<span class="highlight">${match}</span>`
                            );
                            messageSpan.innerHTML += highlightedText;
                        } else {
                            messageSpan.appendChild(document.createTextNode(log.message));
                        }
                        
                        logEntry.appendChild(messageSpan);
                        workflowDiv.appendChild(logEntry);
                    });
                    
                    // Add any related log entries that have a bracketed format
                    const bracketedLogs = logs.filter(log => log.format === 'bracketed' && log.date === date);
                    bracketedLogs.forEach(log => {
                        // Update counters
                        if (log.level === 'INFO') infoCount++;
                        else if (log.level === 'WARNING') warningCount++;
                        else if (log.level === 'ERROR') errorCount++;
                        
                        // Skip if not matching filter
                        if (filterLevel !== 'all' && log.level !== filterLevel) {
                            return;
                        }
                        
                        // Skip if not matching search
                        if (normalizedSearchTerm && 
                            !log.message.toLowerCase().includes(normalizedSearchTerm) && 
                            !log.level.toLowerCase().includes(normalizedSearchTerm)) {
                            return;
                        }
                        
                        workflowHasVisibleLogs = true;
                        
                        const logEntry = document.createElement('div');
                        logEntry.className = 'log-entry';
                        
                        // Format timestamp
                        const timestamp = document.createElement('span');
                        timestamp.className = 'timestamp';
                        timestamp.textContent = log.timestamp;
                        logEntry.appendChild(timestamp);
                        
                        // Format log level
                        const levelSpan = document.createElement('span');
                        levelSpan.className = `log-level level-${log.level}`;
                        levelSpan.textContent = log.level;
                        logEntry.appendChild(levelSpan);
                        
                        // Format message with emoji if present
                        const messageSpan = document.createElement('span');
                        messageSpan.className = 'message';
                        
                        if (log.emoji) {
                            const emojiSpan = document.createElement('span');
                            emojiSpan.className = 'emoji';
                            emojiSpan.textContent = log.emoji;
                            messageSpan.appendChild(emojiSpan);
                        }
                        
                        // Highlight search term if present
                        if (normalizedSearchTerm) {
                            const messageText = log.message;
                            const searchRegExp = new RegExp(normalizedSearchTerm, 'gi');
                            const highlightedText = messageText.replace(searchRegExp, match => 
                                `<span class="highlight">${match}</span>`
                            );
                            messageSpan.innerHTML += highlightedText;
                        } else {
                            messageSpan.appendChild(document.createTextNode(log.message));
                        }
                        
                        logEntry.appendChild(messageSpan);
                        workflowDiv.appendChild(logEntry);
                    });
                    
                    // Only add workflow group if it has visible logs after filtering
                    if (workflowHasVisibleLogs) {
                        logDisplay.appendChild(workflowDiv);
                    }
                });
                
                // Add separator
                if (logDisplay.childElementCount > 0) {
                    const separator = document.createElement('div');
                    separator.className = 'separator';
                    logDisplay.appendChild(separator);
                    
                    // Add summary section
                    const summary = document.createElement('div');
                    summary.className = 'summary';
                    
                    const addSummaryItem = (level, count, levelClass) => {
                        if (count > 0) {
                            const item = document.createElement('div');
                            item.className = 'summary-item';
                            item.innerHTML = `<span class="log-level ${levelClass}">${level}</span> <span class="summary-count">${count}</span>`;
                            summary.appendChild(item);
                        }
                    };
                    
                    addSummaryItem('INFO', infoCount, 'level-INFO');
                    addSummaryItem('WARNING', warningCount, 'level-WARNING');
                    addSummaryItem('ERROR', errorCount, 'level-ERROR');
                    addSummaryItem('SUCCESS', successCount, 'level-SUCCESS');
                    
                    logDisplay.appendChild(summary);
                } else {
                    // No logs matched the filter or search
                    let message = 'No logs available for this date';
                    
                    if (filterLevel !== 'all') {
                        message = `No ${filterLevel.toLowerCase()} logs found for this date`;
                    }
                    
                    if (normalizedSearchTerm) {
                        message += searchTerm ? ` containing "${searchTerm}"` : '';
                    }
                    
                    logDisplay.innerHTML = `<div class="no-logs">${message}</div>`;
                }
            }

            // Add event listener for date selector
            document.getElementById('dateSelector').addEventListener('change', function() {
                const selectedDate = this.value;
                const selectedFilter = document.querySelector('.filter-button.active').getAttribute('data-level');
                const searchTerm = document.getElementById('searchInput').value;
                displayLogsForDate(selectedDate, groupedLogs, selectedFilter, searchTerm);
            });
            
            // Add event listener for refresh button
            document.getElementById('refreshButton').addEventListener('click', function() {
                loadLogData();
            });
            
            // Add event listener for auto-refresh toggle
            let autoRefreshTimer = null;
            document.getElementById('autoRefreshToggle').addEventListener('change', function() {
                const autoRefreshStatus = document.getElementById('autoRefreshStatus');
                
                if (this.checked) {
                    autoRefreshStatus.textContent = 'on';
                    autoRefreshTimer = setInterval(loadLogData, autoRefreshInterval);
                } else {
                    autoRefreshStatus.textContent = 'off';
                    if (autoRefreshTimer) {
                        clearInterval(autoRefreshTimer);
                        autoRefreshTimer = null;
                    }
                }
            });
            
            // Add event listener for search input
            document.getElementById('searchInput').addEventListener('input', function() {
                const selectedDate = document.getElementById('dateSelector').value;
                const selectedFilter = document.querySelector('.filter-button.active').getAttribute('data-level');
                const searchTerm = this.value;
                
                // Debounce the search
                clearTimeout(this.searchTimeout);
                this.searchTimeout = setTimeout(() => {
                    displayLogsForDate(selectedDate, groupedLogs, selectedFilter, searchTerm);
                }, 300);
            });
            
            // Add event listeners for filter buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.addEventListener('click', function() {
                    // Remove active class from all buttons
                    document.querySelectorAll('.filter-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    // Get selected filter level
                    const level = this.getAttribute('data-level');
                    
                    // Get selected date
                    const selectedDate = document.getElementById('dateSelector').value;
                    const searchTerm = document.getElementById('searchInput').value;
                    
                    // Display logs with filter applied
                    displayLogsForDate(selectedDate, groupedLogs, level, searchTerm);
                });
            });
            
            // Initialize the log viewer
            loadLogData();
            
            // Add event listener for date selector
            document.getElementById('dateSelector').addEventListener('change', function() {
                const selectedDate = this.value;
                const selectedFilter = document.querySelector('.filter-button.active').getAttribute('data-level');
                const searchTerm = document.getElementById('searchInput').value;
                displayLogsForDate(selectedDate, groupedLogs, selectedFilter, searchTerm);
            });
            
            // Add event listener for refresh button
            document.getElementById('refreshButton').addEventListener('click', function() {
                loadLogData();
            });
            
            // Add event listener for auto-refresh toggle
            let autoRefreshTimer = null;
            document.getElementById('autoRefreshToggle').addEventListener('change', function() {
                const autoRefreshStatus = document.getElementById('autoRefreshStatus');
                
                if (this.checked) {
                    autoRefreshStatus.textContent = 'on';
                    autoRefreshTimer = setInterval(loadLogData, autoRefreshInterval);
                } else {
                    autoRefreshStatus.textContent = 'off';
                    if (autoRefreshTimer) {
                        clearInterval(autoRefreshTimer);
                        autoRefreshTimer = null;
                    }
                }
            });
            
            // Add event listener for search input
            document.getElementById('searchInput').addEventListener('input', function() {
                const selectedDate = document.getElementById('dateSelector').value;
                const selectedFilter = document.querySelector('.filter-button.active').getAttribute('data-level');
                const searchTerm = this.value;
                
                // Debounce the search
                clearTimeout(this.searchTimeout);
                this.searchTimeout = setTimeout(() => {
                    displayLogsForDate(selectedDate, groupedLogs, selectedFilter, searchTerm);
                }, 300);
            });
            
            // Add event listeners for filter buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.addEventListener('click', function() {
                    // Remove active class from all buttons
                    document.querySelectorAll('.filter-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    // Get selected filter level
                    const level = this.getAttribute('data-level');
                    
                    // Get selected date
                    const selectedDate = document.getElementById('dateSelector').value;
                    const searchTerm = document.getElementById('searchInput').value;
                    
                    // Display logs with filter applied
                    displayLogsForDate(selectedDate, groupedLogs, level, searchTerm);
                });
            });
        });
    </script>
</body>
</html>
