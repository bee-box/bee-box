<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title id="pageTitle">Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html { scrollbar-gutter: stable; }

  body {
    margin: 0 auto;
    padding: 1rem;
    max-width: 1200px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #f5f5f5;
    line-height: 1.6;
  }

  .section-box {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  nav { padding-bottom: 1rem; }
  #navtitle { background: #FFDC00; }

  .nav-container {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
  }

  .nav-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-right: 1rem;
    min-width: 200px;
  }

  .nav-left h1 {
    margin: 0;
    font-size: 1.75rem;
  }

  .date-display {
    height: 1.25rem;
    color: #000;
  }

  .nav-right {
    margin-left: auto;
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    align-items: center;
  }

  .nav-right a,
  .nav-right button,
  .nav-right select {
    background: #fff;
    color: #000;
    border: 1px solid #000;
    font-size: 14px;
    padding: .25rem .5rem;
    height: 30px;
    box-sizing: border-box;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .2s, color .2s;
    text-decoration: none;
    border-radius: 4px;
  }

  .nav-right a:hover,
  .nav-right button:hover,
  .nav-right select:hover {
    background: #000;
    color: #fff;
    border-color: #000;
  }

  select#dateSelector {
    min-width: 190px;
    max-width: 190px;
  }

  #toolContent.loading,
  #toolContent.error {
    min-height: 12rem;
  }

  #toolContent.fade-in {
    animation: fade .4s ease-in;
  }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #toolContent div {
    margin: .5rem 0;
    padding: .5rem;
    border: 1px solid #eee;
    border-radius: 4px;
  }

  footer {
    padding-top: 1rem;
    font-size: 14px;
    text-align: center;
    color: #666;
  }

  .error {
    color: #d32f2f;
    text-align: center;
  }

  #headerContent p {
    margin: 0;
    text-align: center;
  }

  #headerContent p:not(:last-child) {
    margin-bottom: 0.25rem;
  }

  /* ───── Modal Styles ───── */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .modal-content {
    background: white;
    width: 95%;
    max-width: 540px;
    min-height: 620px;
    border-radius: 8px;
    position: relative;
    box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal-content iframe {
    flex: 1;
    width: 100%;
    height: 620px;
    border: none;
  }

  .modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #555;
    z-index: 10001;
  }

  @media print {
    nav, footer, .nav-right, #subscribePopupBtn, .modal-overlay {
      display: none !important;
    }
  }

  @media (max-width: 600px) {
    .nav-container {
      flex-direction: column;
      align-items: flex-start;
    }

    .nav-right {
      width: 100%;
      justify-content: flex-start;
    }

    .nav-right > * {
      width: 100%;
    }

    .nav-left h1 {
      font-size: 1.5rem;
    }

    .section-box {
      padding: 1rem;
    }
  }
</style>
</head>
<body>
  <nav id="navtitle" class="section-box">
    <div class="nav-container">
      <div class="nav-left">
        <h1 id="toolNameHeading"></h1>
        <div id="navtitleContent" class="date-display"></div>
      </div>
      <div class="nav-right" id="navControls">
        <select id="dateSelector"><option value="">Choose a Day</option></select>
        <button id="printButton">Print</button>
        <button id="revealButton">Reveal</button>
        <a href="https://beebox.ghost.io" target="_blank">Home</a>
        <a href="#" id="subscribePopupBtn" onclick="openSubscribeModal(); return false;">Subscribe</a>
      </div>
    </div>
  </nav>

  <section id="header" class="section-box">
    <div id="headerContent" class="loading">Loading...</div>
  </section>

  <section id="tool" class="section-box">
    <div id="toolContent" class="loading">Loading...</div>
  </section>

  <footer class="section-box">
    <p>Made by Kevin Kolb · <a href="https://beebox.ghost.io" target="_blank">beebox.ghost.io</a></p>
  </footer>

  <!-- Subscribe Modal -->
  <div class="modal-overlay" id="subscribeOverlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeSubscribeModal()">&times;</button>
      <iframe src="https://beebox.ghost.io/subscribe/" title="Subscribe Form"></iframe>
    </div>
  </div>

  <script>
    const toolName = "Tool Template";

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('pageTitle').textContent = toolName;
      document.getElementById('toolNameHeading').textContent = toolName;
      setupEventListeners();
      loadPuzzleData();
    });

    function openSubscribeModal() {
      document.getElementById('subscribeOverlay').style.display = 'flex';
    }

    function closeSubscribeModal() {
      document.getElementById('subscribeOverlay').style.display = 'none';
    }

    function setupEventListeners() {
      document.getElementById('dateSelector').addEventListener('change', e => {
        const d = e.target.value;
        if (d) {
          const u = new URL(window.location);
          u.searchParams.set('date', d);
          u.searchParams.delete('puzzleid');
          window.location.href = u.toString();
        }
      });

      document.getElementById('printButton').addEventListener('click', () => window.print());

      document.getElementById('revealButton').addEventListener('click', () =>
        alert('Revealing answers is not yet implemented')
      );
    }

    async function loadPuzzleData() {
      const box = document.getElementById('toolContent');
      box.className = 'loading';
      box.textContent = 'Loading puzzle...';

      try {
        const res = await fetch('xml/puzzles.xml');
        const xmlText = await res.text();
        const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
        const puzzles = [...xml.querySelectorAll('puzzle')].filter(p => p.getElementsByTagName('word').length);
        const sorted = puzzles.sort((a, b) => new Date(b.getAttribute('date')) - new Date(a.getAttribute('date')));

        const params = new URLSearchParams(window.location.search);
        const puzzleId = params.get('puzzleid');
        const date = params.get('date');

        let selected;
        if (puzzleId && !date) {
          selected = sorted.find(p => p.getAttribute('id') === puzzleId);
        } else if (date && !puzzleId) {
          selected = sorted.find(p => p.getAttribute('date') === date);
        } else {
          selected = sorted[0];
        }

        populateDateSelector(sorted);

        if (date && !puzzleId) {
          document.getElementById('dateSelector').value = date;
        }

        displayPuzzle(selected);
      } catch (err) {
        box.className = 'error';
        box.textContent = 'Unable to load puzzle.';
      }
    }

    function populateDateSelector(puzzles) {
      const sel = document.getElementById('dateSelector');
      while (sel.options.length > 1) sel.remove(1);
      puzzles.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.getAttribute('date');
        opt.textContent = p.getAttribute('date');
        sel.appendChild(opt);
      });
    }

    function formatDateString(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    function displayPuzzle(puzzle) {
      const box = document.getElementById('toolContent');
      if (!puzzle) {
        box.className = 'error';
        box.textContent = 'No puzzle found.';
        return;
      }

      const rawDate = puzzle.getAttribute('date');
      const titleDate = formatDateString(rawDate);
      document.getElementById('navtitleContent').textContent = titleDate;

      const words = [...puzzle.getElementsByTagName('word')].map(w => w.textContent);
      const wordCount = words.length;
      const pangrams = puzzle.getAttribute("pangrams") || 0;
      const perfect = puzzle.getAttribute("perfectpangrams") || 0;
      const bingo = puzzle.getAttribute("bingo") === "BINGO" ? "BINGO" : "NO BINGO";
      const q = parseInt(puzzle.getAttribute("queenbee") || 0, 10);

      const headerLines = [
        `The Completely Unauthorized NY Times Spelling Bee Toolbox presents the ${toolName} for ${titleDate}`,
        `Words: ${wordCount}, Pangrams: ${pangrams} (${perfect} Perfect), ${bingo}`,
        q ? `Good Start: ${Math.round(q * .02)}, Moving Up: ${Math.round(q * .05)}, Good: ${Math.round(q * .08)}, Solid: ${Math.round(q * .15)}, Nice: ${Math.round(q * .25)}, Great: ${Math.round(q * .4)}, Amazing: ${Math.round(q * .5)}, Genius: ${Math.round(q * .7)}, Queen Bee: ${q}` : ''
      ];

      document.getElementById('headerContent').innerHTML = headerLines.filter(Boolean).map(l => `<p>${l}</p>`).join("");
      box.className = '';
      box.innerHTML = '';
      box.classList.add('fade-in');

      words.forEach(word => {
        const div = document.createElement('div');
        div.textContent = word;
        box.appendChild(div);
      });

      setTimeout(() => box.classList.remove('fade-in'), 400);
    }
  </script>
</body>
</html>
