<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bee Cheat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style/cheat.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-title">Bee Cheat</div>
  <div class="navbar-buttons">
    <div class="nav-controls">
      <button id="prevDayBtn">←</button>
      <select id="dateSelector"></select>
      <button id="nextDayBtn">→</button>
    </div>
    <button class="navbar-button" onclick="window.print()">🖨️ Print</button>
    <a class="navbar-button" href="https://beebox.ghost.io">🐝 Bee Box</a>
  </div>
</nav>

<div class="subtitle" id="worksheetTitle">The Bee Cheat for</div>
<div class="puzzle" id="puzzle"></div>

<script>
function loadPuzzle(puzzle) {
  const rawDate = puzzle.getAttribute("date");
  const [yyyy, mm, dd] = rawDate.split('-');
  const fullDate = new Date(+yyyy, +mm - 1, +dd);
  const formatted = fullDate.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: '2-digit'
  });
  document.getElementById("worksheetTitle").textContent = `The Bee Cheat for ${formatted}`;

  const wordElements = Array.from(puzzle.getElementsByTagName("word"));
  const words = wordElements.map(w => ({
    full: w.textContent,
    clue: (w.getAttribute("firsttwo") || w.textContent.slice(0, 2)).toUpperCase()
  }));

  words.sort((a, b) => a.full.localeCompare(b.full));

  const container = document.getElementById("puzzle");
  container.innerHTML = "";

  const grid = document.createElement("div");
  grid.className = "word-grid";

  for (let word of words) {
    const box = document.createElement("div");
    box.className = "word-box";
    box.textContent = word.clue;
    box.dataset.revealed = "false";
    box.dataset.full = word.full;

    box.addEventListener("click", () => {
      if (box.dataset.revealed === "true") {
        box.textContent = word.clue;
        box.dataset.revealed = "false";
      } else {
        box.textContent = word.full;
        box.dataset.revealed = "true";
      }
    });

    grid.appendChild(box);
  }

  container.appendChild(grid);
}

function populateDateSelector() {
  const params = new URLSearchParams(window.location.search);
  const urlDate = params.get("date");
  fetch("xml/puzzles.xml")
    .then(response => response.text())
    .then(xmlText => {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "application/xml");
      const puzzles = Array.from(xmlDoc.getElementsByTagName("puzzle"));
      const selector = document.getElementById("dateSelector");

      puzzles.sort((a, b) => new Date(b.getAttribute("date")) - new Date(a.getAttribute("date")));

      for (let p of puzzles) {
        const dateStr = p.getAttribute("date");
        const option = document.createElement("option");
        option.value = dateStr;
        option.textContent = new Date(dateStr).toDateString();
        selector.appendChild(option);
      }

      const targetPuzzle = puzzles.find(p => p.getAttribute("date") === urlDate) || puzzles[1];
      selector.value = targetPuzzle.getAttribute("date");
      loadPuzzle(targetPuzzle);
    });
}

document.getElementById("dateSelector").addEventListener("change", function () {
  const date = this.value;
  window.location.href = `${window.location.pathname}?date=${date}`;
});

document.getElementById("prevDayBtn").addEventListener("click", () => {
  const selector = document.getElementById("dateSelector");
  if (selector.selectedIndex < selector.options.length - 1) {
    window.location.href = `${window.location.pathname}?date=${selector.options[selector.selectedIndex + 1].value}`;
  }
});

document.getElementById("nextDayBtn").addEventListener("click", () => {
  const selector = document.getElementById("dateSelector");
  if (selector.selectedIndex > 0) {
    window.location.href = `${window.location.pathname}?date=${selector.options[selector.selectedIndex - 1].value}`;
  }
});

window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.word-box').forEach(box => {
    box.textContent = box.dataset.full;
    box.dataset.revealed = "true";
  });
});

populateDateSelector();
</script>

</body>
</html>
