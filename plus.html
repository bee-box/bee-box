<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bee Plus Comparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .letters {
      font-size: 1.5em;
      margin-bottom: 1em;
    }
    .letters b {
      color: #000;
      background: #f7da21;
      padding: 0.2em 0.4em;
      border-radius: 4px;
    }
    .word {
      display: inline-block;
      margin: 4px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 1rem;
    }
    .puzzle-word {
      background-color: #fff176;
    }
    .extra-word {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

<h1>🐝 Bee Plus Comparison</h1>
<div id="output"></div>

<script>
async function loadXML(url) {
  const response = await fetch(url);
  const text = await response.text();
  return new window.DOMParser().parseFromString(text, "application/xml");
}

async function loadText(url) {
  const response = await fetch(url);
  return response.text();
}

function getQueryDate() {
  const params = new URLSearchParams(window.location.search);
  return params.get("date");
}

function renderLetters(letters) {
  return letters
    .split('')
    .map((ch, i) => i === 0 ? `<b>${ch}</b>` : ch.toUpperCase())
    .join(' ');
}

async function displayWords() {
  const xmlDoc = await loadXML('xml/puzzles.xml');
  const puzzles = Array.from(xmlDoc.getElementsByTagName('puzzle')).filter(p => p.getAttribute("letters"));

  if (!puzzles.length) return;

  const queryDate = getQueryDate();
  let targetPuzzle = puzzles.find(p => p.getAttribute("date") === queryDate);
  if (!targetPuzzle) targetPuzzle = puzzles[puzzles.length - 1];

  const puzzleDate = targetPuzzle.getAttribute('date');
  const letters = targetPuzzle.getAttribute('letters').toUpperCase();
  const center = letters[0];

  const puzzleWords = new Set(
    Array.from(targetPuzzle.getElementsByTagName('word'))
      .map(w => w.textContent.trim().toUpperCase())
  );

  const dictionaryText = await loadText('xml/dictionary.txt');
  const dictionaryWords = dictionaryText
    .split('\n')
    .map(w => w.trim().toUpperCase())
    .filter(w =>
      w.length >= 4 &&
      w.includes(center) &&
      [...w].every(ch => letters.includes(ch))
    );

  const extraWords = dictionaryWords.filter(w => !puzzleWords.has(w));

  const allWords = [
    ...Array.from(puzzleWords).map(w => ({ word: w, className: 'puzzle-word' })),
    ...extraWords.map(w => ({ word: w, className: 'extra-word' }))
  ].sort((a, b) => a.word.localeCompare(b.word));

  const output = document.getElementById('output');
  output.innerHTML = `
    <h2>Puzzle Date: ${puzzleDate}</h2>
    <div class="letters">${renderLetters(letters)}</div>
    <div><strong>Center Letter:</strong> ${center}</div>
    <h3>Bee Words (${puzzleWords.size})</h3>
  `;

  const container = document.createElement('div');
  allWords.forEach(({ word, className }) => {
    const span = document.createElement('span');
    span.className = `word ${className}`;
    span.textContent = word;
    container.appendChild(span);
  });

  output.appendChild(container);
  output.innerHTML += `<h3>Plus Words (${extraWords.length})</h3>`;
}
displayWords();
</script>

</body>
</html>
